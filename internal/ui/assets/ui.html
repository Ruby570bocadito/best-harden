.progress > i { display: block; width: 30%; height: 100%; background: var(--moon); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.loading { padding: 60px 20px; text-align: center; color: var(--muted); }
.loading .spin { width: 28px; height: 28px; border: 3px solid var(--track); border-top-color: var(--moon); border-radius: 50%; margin: 0 auto 14px; animation: rot .9s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.toast { position: fixed; right: 16px; bottom: 16px; max-width: min(440px, calc(100vw - 32px)); background: var(--stone); color: var(--stone-ink); padding: 11px 15px; border-radius: 8px; font-size: 14px; z-index: 10; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); } /* taste-skill-ignore: flota sobre la página */
footer { color: var(--muted); font-size: 12.5px; padding: 28px 0 8px; }

@media (max-width: 980px) {
  .two, .wide-left, .rows { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .hero-fix { border-left: 0; padding-left: 0; border-top: 1px solid var(--hair); padding-top: 20px; }
  .wall-row { gap: 6px; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .top .wrap { flex-wrap: wrap; height: auto; gap: 8px 12px; padding-top: 10px; }
  .brand { min-height: 36px; }
  nav.tabs { order: 3; width: 100%; margin-left: 0; height: 44px; }
  .progress { top: 0; }
  .page-head { padding-top: 22px; }
  .page-head h1 { font-size: 24px; }
  .figure .num { font-size: 40px; }
  .wall-card { padding: 18px; }
  .card { padding: 16px; }
  #scanBtn .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { .progress > i, .loading .spin { animation: none; } .tower { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29V11h5v4h4v-4h8v4h4v-4h5v18z" style="fill:var(--stone)"/><path d="M3 19h26" style="stroke:var(--page);stroke-width:2"/><circle cx="16" cy="6" r="2.6" style="fill:var(--moon)"/></svg>
      <span class="name">Adarve</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    <div class="spacer"></div>
    <button class="btn primary" id="scanBtn" type="button">Hacer la ronda<span class="long"> ahora</span></button>
    <button class="btn icon" id="theme" type="button" aria-label="Cambiar entre noche y día" title="Noche o día"><svg class="icon i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 12.9A6.6 6.6 0 0 1 7.1 4.4a6.6 6.6 0 1 0 8.5 8.5z"/></svg><svg class="icon i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg></button>
  </div>
</header>
<div class="progress" id="progress" aria-hidden="true"><i></i></div>
<main class="wrap" id="app" aria-live="polite"></main>

<script nonce="__NONCE__">
(function () {
  "use strict";
  // Todo el contenido procedente del sistema auditado se inserta con
  // textContent: nunca se interpreta como HTML.

  // ---- Token de la sesión ----
  // La sesión va en una cookie HttpOnly que el servidor fija al abrir la
  // dirección de "adarve ui" (y la quita de la URL con una redirección): el
  // script nunca ve el token. Cada petición lleva X-Adarve-Request, que una
  // web ajena no puede añadir sin una comprobación CORS que no se concede.

  // Nombre del producto en la interfaz y del ejecutable en los comandos que
  // se muestran para copiar.
  var BRAND = "Adarve";
  var CLI = "adarve";

  var SEV = {
    critical: { label: "Crítico", color: "var(--critical)", rank: 0, weight: 10 },
    high: { label: "Alto", color: "var(--serious)", rank: 1, weight: 5 },
    medium: { label: "Medio", color: "var(--warning)", rank: 2, weight: 3 },
    low: { label: "Bajo", color: "var(--info)", rank: 3, weight: 1 },
    info: { label: "Info", color: "var(--info)", rank: 4, weight: 0 }
  };
  var STATUS = {
    fail: { label: "Brecha", color: "var(--critical)" },
    error: { label: "Error", color: "var(--warning)" },
    skipped: { label: "Sin evaluar", color: "var(--muted)" },
    exception: { label: "Excepción", color: "var(--info)" },
    manual: { label: "Revisión manual", color: "var(--moon)" },
    pass: { label: "Superado", color: "var(--good)" },
    na: { label: "No aplica", color: "var(--info)" }
  };
  var RISK = { none: "ninguno", low: "bajo", medium: "medio", high: "alto" };
  var WAVE_OF = { none: 1, low: 1, medium: 2, high: 3 };
  var ROLE = { workstation: "Estación de trabajo", server: "Servidor", dc: "Controlador de dominio" };
  var CHANGE = { applied: "Aplicado", partial: "Parcial", failed: "Fallido", "rolled-back": "Deshecho", "in-progress": "En curso", nothing: "Sin cambios" };
  var GROUPS = [
    ["planned", "Lo que repararé", ""],
    ["wave", "Requieren una ola superior", "sube la ola para incluirlos"],
    ["remote", "Afectan al acceso remoto", CLI + " harden --include-remote (con dead-man switch)"],
    ["gpo", "Gestionados por una GPO de dominio", "corrígelos en la GPO o usa --force-local"],
    ["manual", "Decisión tuya (remediación manual)", CLI + " rules show <ID>"],
    ["capture-error", "No se pudo leer el estado", ""],
    ["unsupported", "No disponibles en esta plataforma", ""],
    ["nothing", "Sin nada que cambiar", ""]
  ];
  var TABS = [["panel", "Muralla"], ["controles", "Brechas"], ["plan", "Plan de reparación"], ["superficie", "Puertas"], ["historial", "Rondas"], ["excepciones", "Excepciones"]];

  var S = { info: null, reports: [], report: null, reportId: "", latestId: "", plan: { wave: 1, items: null, loading: false },
    changes: null, exceptions: null, schedule: null, surface: null, surfaceLoading: false, showLocal: false, scanning: false, tab: "panel", error: "",
    sim: 0, tramo: "", heights: {} };

  // ---- Utilidades ----
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === false) continue;
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k === "onclick") n.addEventListener("click", attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c !== null && c !== undefined && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, children) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs || {}) n.setAttribute(k, attrs[k]);
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  // Iconos de trazo, del mismo juego que el del tema.
  function icon(kind) {
    var d = { info: "M10 2.6a7.4 7.4 0 1 1 0 14.8 7.4 7.4 0 0 1 0-14.8zM10 9v5M10 6.3v.1",
      warn: "M10 2.8 18 16.8H2zM10 7.8v4.4M10 14.4v.1" }[kind];
    return svg("svg", { class: "icon", viewBox: "0 0 20 20", "aria-hidden": "true" }, [svg("path", { d: d })]);
  }
  // scored === false: ningún control evaluado (los informes antiguos no
  // traen el campo y siempre tienen puntuación).
  function scored(sc) { return !!sc && sc.scored !== false; }
  function scoreText(sc) { return scored(sc) ? "muralla al " + sc.value + " %" : "sin evaluar"; }
  function scoreColor(v) { return v >= 80 ? "var(--good)" : v >= 60 ? "var(--warning)" : "var(--critical)"; }
  function scoreWord(v) { return v >= 90 ? "firme" : v >= 80 ? "sólida" : v >= 70 ? "con grietas" : v >= 60 ? "débil" : "muy dañada"; }
  function gradeOf(v) { return v >= 90 ? "A" : v >= 80 ? "B" : v >= 70 ? "C" : v >= 60 ? "D" : "F"; }
  // Igual que engine.pct: porcentaje redondeado con aritmética entera.
  function pct(got, max) { return max ? Math.floor((got * 100 + Math.floor(max / 2)) / max) : 0; }
  function dot(color) { return el("span", { class: "dot", style: "background:" + color }); }
  function badge(color, text, icon) {
    return el("span", { class: "badge" }, [icon ? el("span", { text: icon, style: "color:" + color + ";font-weight:700" }) : dot(color), text]);
  }
  function sevBadge(s) { var x = SEV[s] || SEV.info; return badge(x.color, x.label); }
  function statusBadge(s) { var x = STATUS[s] || STATUS.na; return badge(x.color, x.label); }
  function fmtDate(iso, short) {
    try {
      var d = new Date(iso);
      return short ? d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })
        : d.toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" });
    } catch (e) { return iso; }
  }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "ahora mismo";
    if (m < 60) return "hace " + m + " min";
    var h = Math.round(m / 60);
    if (h < 48) return "hace " + h + " h";
    return "hace " + Math.round(h / 24) + " días";
  }
  // syllables inserta guiones blandos (U+00AD) entre sílabas con la regla
  // básica del español (vocal-consonante-vocal): las etiquetas largas de la
  // muralla («Actualizaciones») se parten por una sílaba y con guion, no a
  // mitad, sin depender de que el navegador tenga diccionario de español.
  function syllables(s) { return String(s).replace(/([aeiouáéíóú])([bcdfghjklmnñpqrstvwxyz])(?=[aeiouáéíóú])/gi, "$1\u00AD$2"); }
  function plural(n, one, many) { return n === 1 ? "1 " + one : n + " " + many; }
  function cmdBox(text) {
    var b = el("button", { class: "btn copy", type: "button", text: "Copiar" });
    b.addEventListener("click", function () {
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar"; }, 1500); });
    });
    return el("div", { class: "cmd" }, [el("code", { text: text }), b]);
  }
  function card(title, children, right) {
    return el("div", { class: "card" }, [el("h2", null, [title, right ? el("span", { class: "right" }, [right]) : null])].concat(children));
  }
  function toast(msg) {
    var t = el("div", { class: "toast", role: "status", text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 5000);
  }
  function busy(on) { document.getElementById("progress").classList.toggle("on", !!on); }
  function sudoWhere() { return S.info.family === "windows" ? "un PowerShell como administrador" : "una terminal con sudo"; }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, { method: opts.method || "GET", headers: { "X-Adarve-Request": "1" }, credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (r.status === 401) throw new Error("la sesión no es válida o ha caducado. Abre de nuevo la dirección que muestra \"" + CLI + " ui\" en la terminal");
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
        return body;
      });
    });
  }

  // ---- Tema: noche (por defecto, el de la marca) o día ----
  var root = document.documentElement;
  try { if (localStorage.getItem("adarve-theme") === "light") root.setAttribute("data-theme", "light"); } catch (e) {}
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    if (next === "light") root.setAttribute("data-theme", "light"); else root.removeAttribute("data-theme");
    try { localStorage.setItem("adarve-theme", next); } catch (e) {}
    if (S.tab === "controles") render(); // el informe incrustado lee el tema al cargar
  });

  // En el teléfono la muralla se dibuja de otra forma (filas en lugar de torres).
  function phoneWall() { return !!(window.matchMedia && window.matchMedia("(max-width: 760px)").matches); }
  if (window.matchMedia) {
    var mqPhone = window.matchMedia("(max-width: 760px)");
    var onPhone = function () { if (S.tab === "panel" && S.report) render(); };
    if (mqPhone.addEventListener) mqPhone.addEventListener("change", onPhone); else if (mqPhone.addListener) mqPhone.addListener(onPhone);
  }

  // ---- Navegación ----
  var tabsEl = document.getElementById("tabs");
  TABS.forEach(function (t) {
    tabsEl.appendChild(el("button", { class: "tab", type: "button", "data-tab": t[0], text: t[1], onclick: function () { go(t[0]); } }));
  });
  function go(tab) { if (location.hash !== "#" + tab) location.hash = tab; else route(); }
  function route() {
    var t = (location.hash || "#panel").slice(1);
    S.tab = TABS.some(function (x) { return x[0] === t; }) ? t : "panel";
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      if (b.getAttribute("data-tab") === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (S.tab === "plan" && S.plan.items === null && !S.plan.loading && S.info) loadPlan(S.plan.wave);
    if (S.tab === "historial" && S.changes === null) loadChanges();
    if (S.tab === "historial" && S.schedule === null) loadSchedule();
    if (S.tab === "superficie" && S.surface === null && !S.surfaceLoading && S.info) loadSurface();
    if (S.tab === "excepciones" && S.exceptions === null) loadExceptions();
    render();
  }
  window.addEventListener("hashchange", route);

  // ---- Datos ----
  var scanBtn = document.getElementById("scanBtn");
  scanBtn.addEventListener("click", function () { scan(); });

  function scan() {
    if (S.scanning) return;
    S.scanning = true; scanBtn.disabled = true; busy(true);
    if (!S.report) render();
    api("/api/scan", { method: "POST" }).then(function (res) {
      S.report = res.report; S.reportId = res.id; S.latestId = res.id;
      S.plan.items = null; S.sim = 0;
      return api("/api/reports").then(function (list) { S.reports = list; });
    }).then(function () {
      toast("Ronda terminada: " + scoreText(S.report.score) + ".");
      if (S.tab === "plan") loadPlan(S.plan.wave);
    }).catch(function (e) { toast("No pude hacer la ronda: " + e.message); })
      .then(function () { S.scanning = false; scanBtn.disabled = false; busy(false); render(); });
  }

  function openReport(id) {
    busy(true);
    return api("/api/reports/" + encodeURIComponent(id)).then(function (rep) {
      S.report = rep; S.reportId = id; S.sim = 0; render();
    }).catch(function (e) { toast("No se pudo abrir la ronda: " + e.message); }).then(function () { busy(false); });
  }

  function loadPlan(wave) {
    S.plan.wave = wave; S.plan.loading = true; S.plan.items = null; busy(true); render();
    api("/api/plan?wave=" + wave).then(function (items) { S.plan.items = items; })
      .catch(function (e) { S.plan.items = []; S.plan.error = e.message; toast("No se pudo calcular el plan: " + e.message); })
      .then(function () { S.plan.loading = false; busy(false); render(); });
  }
  function loadSurface() {
    S.surfaceLoading = true; busy(true); render();
    api("/api/surface").then(function (r) { S.surface = r; })
      .catch(function (e) { toast("No se pudieron revisar las puertas: " + e.message); })
      .then(function () { S.surfaceLoading = false; busy(false); render(); });
  }
  function loadSchedule() {
    api("/api/schedule").then(function (x) { S.schedule = x; render(); }).catch(function (e) { S.schedule = { status: { detail: e.message }, runs: [] }; render(); toast(e.message); });
  }
  function loadChanges() {
    api("/api/changes").then(function (c) { S.changes = c; render(); }).catch(function (e) { S.changes = []; toast(e.message); });
  }
  function loadExceptions() {
    api("/api/exceptions").then(function (x) { S.exceptions = x; render(); }).catch(function (e) { S.exceptions = []; toast(e.message); });
  }

  // ---- Render ----
  var app = document.getElementById("app");
  function render() {
    app.textContent = "";
    if (S.error) { app.appendChild(el("div", { class: "loading" }, [el("p", { text: S.error })])); return; }
    if (!S.info) { app.appendChild(loadingBox("Subiendo al adarve…")); return; }
    app.appendChild(pageHead());
    if (!S.report) {
      app.appendChild(S.scanning ? loadingBox("Haciendo la ronda: reviso el equipo sin tocar nada. Tarda unos segundos.") :
        el("div", { class: "card empty", style: "margin-top:18px" }, [el("p", { text: "Todavía no he hecho ninguna ronda en este equipo." }),
          el("button", { class: "btn primary", type: "button", text: "Hacer la primera ronda", onclick: function () { scan(); } })]));
      return;
    }
    banners().forEach(function (b) { app.appendChild(b); });
    ({ panel: renderPanel, controles: renderControls, plan: renderPlan, superficie: renderSurface, historial: renderHistory, excepciones: renderExceptions })[S.tab]();
    app.appendChild(el("footer", null, [BRAND + " " + S.info.version + " · consola local en 127.0.0.1. Solo mira y hace rondas: las reparaciones se aplican desde la terminal con " +
      CLI + " harden, que guarda una instantánea y permite deshacerlas."]));
    growTowers();
  }

  function loadingBox(text) { return el("div", { class: "loading" }, [el("div", { class: "spin" }), el("div", { text: text })]); }

  function pageHead() {
    var i = S.info, r = S.report;
    var meta = el("div", { class: "meta" });
    [["Sistema", i.system], ["Rol", ROLE[i.role] || i.role], ["Perfil", r && r.profile ? r.profile.name : i.profile],
     ["Ronda", r ? fmtDate(r.finished_at) + " (" + ago(r.finished_at) + ")" : "—"]].forEach(function (p) {
      if (p[1]) meta.appendChild(el("span", null, [el("b", { text: p[0] }), p[1]]));
    });
    return el("div", { class: "page-head" }, [el("h1", { text: i.hostname }), meta]);
  }

  function banners() {
    var out = [], r = S.report, sc = r.score;
    if (S.reportId && S.latestId && S.reportId !== S.latestId) {
      out.push(el("div", { class: "banner info" }, [el("span", { class: "ico" }, [icon("info")]),
        el("span", { class: "grow", text: "Estás viendo una ronda anterior (" + fmtDate(r.finished_at) + ")." }),
        el("button", { class: "btn copy", type: "button", text: "Volver a la última", onclick: function () { openReport(S.latestId); } })]));
    }
    if (!S.info.is_admin) {
      out.push(el("div", { class: "banner" }, [el("span", { class: "ico" }, [icon("warn")]),
        el("span", { text: "Hago la ronda sin privilegios" + (sc.skipped ? ": " + plural(sc.skipped, "control queda", "controles quedan") + " sin revisar y no cuentan" : "") +
          ". Ciérrame y lanza " + CLI + " ui desde " + sudoWhere() + "." })]));
    }
    var expired = (r.results || []).filter(function (x) { return x.exception && x.exception.expired; });
    if (expired.length) {
      out.push(el("div", { class: "banner" }, [el("span", { class: "ico" }, [icon("warn")]),
        el("span", { text: (expired.length === 1 ? "1 excepción ha caducado" : expired.length + " excepciones han caducado") + ": " +
          expired.map(function (x) { return x.rule.id; }).join(", ") + ". Repara el control o renueva la excepción." })]));
    }
    return out;
  }

  // ---- La muralla ----
  function isAuto(x) { var rem = x.rule.remediation || {}; return !!(rem.actions && rem.actions.length); }
  function isRemote(x) { return (x.rule.remediation || {}).safety === "remote-access"; }
  function waveOf(x) { return WAVE_OF[(x.rule.remediation || {}).breaking_risk] || 1; }
  // Una brecha que "harden --apply --wave N" repararía sola (sin el acceso remoto).
  function mendedBy(x, sim) { return sim > 0 && isAuto(x) && !isRemote(x) && waveOf(x) <= sim; }
  function byPriority(a, b) {
    return (SEV[a.rule.severity].rank - SEV[b.rule.severity].rank) || (waveOf(a) - waveOf(b));
  }

  // wallModel recalcula la puntuación como si las olas hasta "sim" se
  // hubieran aplicado bien, con los mismos pesos que engine.ComputeScore.
  function wallModel(results, sim) {
    var got = 0, max = 0, cats = {}, mended = 0;
    results.forEach(function (x) {
      if (x.status !== "pass" && x.status !== "fail") return;
      var w = (SEV[x.rule.severity] || SEV.info).weight;
      var c = cats[x.rule.category] || (cats[x.rule.category] = { name: x.rule.category, got: 0, max: 0, open: [], mended: [], got0: 0 });
      var fixed = x.status === "fail" && mendedBy(x, sim);
      max += w; c.max += w;
      if (x.status === "pass") c.got0 += w;
      if (x.status === "pass" || fixed) { got += w; c.got += w; }
      if (fixed) { c.mended.push(x); mended++; } else if (x.status === "fail") c.open.push(x);
    });
    var list = Object.keys(cats).map(function (k) {
      var c = cats[k];
      c.value = pct(c.got, c.max); c.value0 = pct(c.got0, c.max);
      c.open.sort(byPriority); c.mended.sort(byPriority);
      return c;
    }).filter(function (c) { return c.max > 0; });
    // Orden estable entre simulaciones: de la más dañada a la más firme hoy.
    list.sort(function (a, b) { return (a.value0 - b.value0) || (a.name < b.name ? -1 : 1); });
    return { value: pct(got, max), cats: list, mended: mended };
  }

  function crackSVG() {
    return svg("svg", { viewBox: "0 0 26 22", "aria-hidden": "true" }, [svg("path", { d: "M2 3l7 6-3 4 8 3-2 4 12-6",
      style: "fill:none;stroke:var(--stone-ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round" })]);
  }

  // Las torres crecen desde la altura que tenían a la nueva (al simular una ola).
  var pendingGrow = [];
  function growTowers() {
    var list = pendingGrow; pendingGrow = [];
    if (!list.length) return;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      list.forEach(function (p) { p[0].style.height = p[1] + "px"; });
    }); });

  // ---- Puertas (superficie de ataque) ----
  var ACCESS_RANK = { open: 0, "": 0, limited: 1, filtered: 2 };
  // gatesOf agrupa los puertos de la red por programa y servicio: cada grupo es una puerta.
  function gatesOf(sf) {
    var byKey = {}, list = [];
    (sf.ports || []).forEach(function (p) {
      if (p.scope !== "network" || p.ephemeral) return;
      var key = (p.process || "?") + "|" + (p.known || "");
      var g = byKey[key];
      if (!g) { g = byKey[key] = { process: p.process || "?", known: p.known || "", ports: [], services: [], access: 2, limit: "", sample: p, findings: [] }; list.push(g); }
      var pp = p.port + "/" + p.proto;
      if (g.ports.indexOf(pp) < 0) g.ports.push(pp);
      (p.services || []).forEach(function (s) { if (g.services.indexOf(s) < 0) g.services.push(s); });
      var a = sf.firewall ? (p.firewall || "") : "";
      var rk = ACCESS_RANK[a] === undefined ? 0 : ACCESS_RANK[a];
      if (rk < g.access) { g.access = rk; g.sample = p; }
      if (a === "limited" && p.firewall_limit && !g.limit) g.limit = p.firewall_limit;
    });
    (sf.findings || []).forEach(function (f) {
      var subj = String(f.subject || "").split(/,\s*/);
      list.forEach(function (g) { if (g.ports.some(function (pp) { return subj.indexOf(pp) >= 0; })) g.findings.push(f); });
    });
    list.forEach(function (g) {
      g.findings.sort(function (a, b) { return (SEV[a.severity] || SEV.info).rank - (SEV[b.severity] || SEV.info).rank; });
      g.sev = g.findings.length ? g.findings[0].severity : "";
    });
    list.sort(function (a, b) {
      var sa = a.sev ? SEV[a.sev].rank : 9, sb = b.sev ? SEV[b.sev].rank : 9;
      return (a.access - b.access) || (sa - sb) || (parseInt(a.ports[0], 10) - parseInt(b.ports[0], 10));
    });
    return list;
  }

  function gateCard(g, small) {
    var door = g.access === 0 ? "door-open" : g.access === 1 ? "door-bars" : "door-shut";
    var cls = "gate" + (g.sev === "critical" ? " crit" : g.sev === "high" ? " high" : "");
    var stateText = g.access === 0 ? "Abierta a cualquiera" : g.access === 1 ? "Con rastrillo" : "Cerrada por el firewall";
    var stateColor = g.access === 0 ? (g.sev ? "var(--critical)" : "var(--serious)") : g.access === 1 ? "var(--warning)" : "var(--good-text)";
    var ports = g.ports.length > 3 ? g.ports.slice(0, 2).join(" · ") + " +" + (g.ports.length - 2) : g.ports.join(" · ");
    var kids = [
      el("div", { class: "top-row" }, [el("div", { class: "arch stone", "aria-hidden": "true" }, [el("span", { class: door })]),
        el("div", { style: "display:flex;flex-direction:column;gap:2px;min-width:0" }, [
          el("span", { class: "port", text: ports, title: g.ports.join(", ") }),
          el("span", { class: "svc", text: g.known || g.process }),
          el("span", { class: "proc", text: g.process + (g.services.length ? " · " + g.services.join(", ") : "") })])]),
      el("div", { style: "display:flex;flex-wrap:wrap;gap:8px;align-items:center" }, [
        el("span", { class: "badge" }, [dot(stateColor), stateText]), g.sev ? sevBadge(g.sev) : null]),
      g.access === 1 && g.limit ? el("div", { class: "sub", text: "Solo desde: " + g.limit }) : null,
      originLine(g.sample)
    ];
    if (!small) {
      if (g.findings.length) {
        kids.push(el("p", { class: "why", text: g.findings[0].detail }));
        kids.push(el("p", { class: "fix", text: "→ " + g.findings[0].fix }));
      } else if (g.access === 0) {
        kids.push(el("p", { class: "why", text: "Sin hallazgos de riesgo conocidos. Si no la usas desde fuera, ciérrala o limítala a tu red." }));
      }
    }
    return el("article", { class: cls }, kids);
  }

  function renderSurface() {
    var sf = S.surface;
    var again = el("button", { class: "btn copy", type: "button", text: "Volver a revisar", disabled: S.surfaceLoading ? "disabled" : null, onclick: function () { loadSurface(); } });
    if (!sf) {
      app.appendChild(el("section", null, [card("Puertas", [S.surfaceLoading ? loadingBox("Revisando las puertas: puertos, firewall, recursos compartidos y administradores…") :
        el("p", { class: "empty", text: "No he podido revisar las puertas." })], again)]));
      return;
    }
    var gates = gatesOf(sf);
    var open = gates.filter(function (g) { return g.access === 0; }), limited = gates.filter(function (g) { return g.access === 1; }),
      shut = gates.filter(function (g) { return g.access === 2; });
    var risky = open.filter(function (g) { return g.sev; });
    var worst = (sf.findings || []).slice().sort(function (a, b) { return (SEV[a.severity] || SEV.info).rank - (SEV[b.severity] || SEV.info).rank; })[0];
    var voice = "Tienes " + plural(gates.length, "puerta", "puertas") + " que dan a la red: " + plural(open.length, "abierta", "abiertas") + " a cualquiera, " +
      limited.length + " con rastrillo (solo ciertas redes) y " + plural(shut.length, "cerrada", "cerradas") + " por el firewall." +
      (worst ? " La que yo atendería primero: «" + worst.title + "»." : " Ninguna con un riesgo conocido.") +
      (sf.firewall ? "" : " No he podido leer el firewall, así que doy por abiertas todas.");
    var color = scoreColor(sf.score);
    app.appendChild(el("div", { class: "card wall-card" }, [el("div", { class: "wall-head" }, [
      el("div", { class: "left" }, [el("h2", { text: "Exposición en la red", style: "margin:0 0 6px" }),
        el("div", { class: "figure" }, [el("span", { class: "num", text: String(sf.score) }), el("span", { class: "pct", text: "/ 100" }),
          el("span", { class: "grade", text: sf.grade, style: "--tone:" + color })]),
        el("p", { class: "voice", text: voice }),
        el("p", { class: "note", text: "Cada hallazgo resta según su severidad (crítico 30, alto 15, medio 7, bajo 3)." })]),
      el("div", { class: "legend" }, [el("span", null, [el("i", { class: "door-open" }), "Abierta a cualquiera"]),
        el("span", null, [el("i", { class: "door-bars" }), "Con rastrillo"]), el("span", null, [el("i", { class: "door-shut" }), "Cerrada"]), again])
    ])]));

    // Cambios desde el último análisis guardado (adarve surface --save).
    if (sf.changes) {
      var KIND = {
        worse: ["↑", "var(--critical)", ""], "new": ["+", "var(--critical)", ""], finding: ["!", "var(--critical)", "Hallazgo nuevo: "],
        better: ["↓", "var(--good-text)", ""], gone: ["−", "var(--good-text)", ""], resolved: ["↓", "var(--good-text)", "Resuelto: "]
      };
      var chItems = sf.changes.items || [];
      var chBody = chItems.length ? el("div", null, chItems.map(function (c) {
        var k = KIND[c.kind] || ["·", "var(--muted)", ""];
        return el("div", { class: "item" }, [el("div", { class: "h" }, [el("b", { text: k[0], style: "color:" + k[1] }), el("span", { class: "t", text: k[2] + c.title })])]);
      })) : el("p", { class: "empty", text: "Ninguna puerta ha cambiado." });
      var chTitle = "Desde la revisión del " + fmtDate(sf.changes.since) + (sf.changes.score_before !== sf.score ? " · exposición " + sf.changes.score_before + " → " + sf.score : "");
      app.appendChild(el("section", null, [card(chTitle, [chBody])]));
    }

    if (open.length) {
      app.appendChild(el("section", null, [el("h2", { class: "sect",
        text: "Abiertas a cualquiera (" + open.length + ")" + (risky.length ? " · " + plural(risky.length, "con riesgo", "con riesgo") : "") }),
        el("div", { class: "gates" }, open.map(function (g) { return gateCard(g, false); }))]));
    }
    if (limited.length) {
      app.appendChild(el("section", null, [el("h2", { class: "sect",
        text: "Con rastrillo: solo desde ciertas redes (" + limited.length + ")" }),
        el("div", { class: "gates small" }, limited.map(function (g) { return gateCard(g, true); }))]));
    }
    if (shut.length) {
      app.appendChild(el("section", null, [el("h2", { class: "sect",
        text: "Cerradas por el firewall (" + shut.length + ")" }),
        el("div", { class: "gates small" }, shut.map(function (g) { return gateCard(g, true); }))]));
    }
    if (!gates.length) app.appendChild(el("section", null, [card("Puertas", [el("p", { class: "empty", text: "Ningún servicio escucha en la red: no hay puertas." })])]));

    var finds = sf.findings.length ? el("div", null, sf.findings.map(function (f) {
      return el("div", { class: "item" }, [
        el("div", { class: "h" }, [sevBadge(f.severity), el("span", { class: "t", text: f.title }), el("span", { class: "rid", text: f.subject })]),
        el("p", { text: f.detail }), el("p", { style: "color:var(--good-text)", text: "→ " + f.fix })]);
    })) : el("p", { class: "empty", text: "Ningún servicio de riesgo expuesto ni recurso compartido abierto a todos." });
    app.appendChild(el("section", null, [card("Hallazgos", [finds])]));

    // La tabla completa, para quien necesite cada dirección y la regla que lo decide.
    var ports = sf.ports || [];
    var hidden = ports.filter(function (p) { return p.scope !== "network" || p.ephemeral; }).length;
    var rows = ports.filter(function (p) { return S.showLocal || (p.scope === "network" && !p.ephemeral); });
    var heads = ["Puerto", "Dirección", "Alcance"].concat(sf.firewall ? ["Firewall"] : [], ["Proceso", "Servicio"]);
    var tbl = el("table", null, [el("thead", null, [el("tr", null, heads.map(function (h) { return el("th", { text: h }); }))])]);
    var tb = el("tbody");
    rows.forEach(function (p) {
      var proc = (p.process || "?") + (p.pid ? " (" + p.pid + ")" : "");
      var scope = p.ephemeral ? el("span", { class: "sub", text: "cliente" }) : p.scope === "network" ?
        el("span", { style: "color:var(--serious-text);font-weight:600", text: "red" }) : el("span", { class: "sub", text: "local" });
      var cells = [el("td", { class: "mono", text: p.port + "/" + p.proto }), el("td", { class: "mono", text: (p.addresses || []).join(", ") }), el("td", null, [scope])];
      if (sf.firewall) {
        cells.push(el("td", { title: p.firewall_why || "" }, [p.firewall === "open" ? el("span", { style: "color:var(--critical);font-weight:600", text: "abierto" }) :
          p.firewall === "limited" ? el("span", { style: "color:var(--serious-text);font-weight:600", text: "limitado: " + (p.firewall_limit || "") }) :
          p.firewall === "filtered" ? el("span", { style: "color:var(--good-text);font-weight:600", text: "filtrado" }) : el("span", { class: "sub", text: "—" }),
          p.firewall_why ? el("div", { class: "sub", text: p.firewall_why }) : null]));
      }
      cells.push(el("td", null, [el("div", { text: proc }), p.services && p.services.length ? el("div", { class: "sub", text: p.services.join(", ") }) : null, originLine(p)]),
        el("td", { text: p.known || "" }));
      tb.appendChild(el("tr", null, cells));
    });
    tbl.appendChild(tb);
    var toggle = el("button", { class: "btn copy", type: "button", text: S.showLocal ? "Solo los de la red" : "Mostrar también locales y de cliente (" + hidden + ")",
      onclick: function () { S.showLocal = !S.showLocal; render(); } });
    var fwNote = "Sin leer el firewall, cada puerto en la red se muestra como accesible, aunque puede estar filtrado.";
    if (sf.firewall && sf.firewall.source && sf.firewall.source.indexOf("tables") >= 0) {
      fwNote = "Firewall de Linux (" + sf.firewall.source + "): " + (sf.firewall.input_policy === "drop" ? "entrada bloqueada por defecto" :
        sf.firewall.input_policy === "accept" ? "entrada permitida por defecto" : "sin reglas de entrada") + " · " + sf.firewall.inbound_rules + " reglas de entrada.";
    } else if (sf.firewall) {
      fwNote = "Firewall de Windows: " + (sf.firewall.profiles || []).filter(function (p) { return p.active; }).map(function (p) {
        return "perfil " + p.name + (p.enabled ? (p.block_inbound ? " activo, entrada bloqueada por defecto" : " activo, entrada permitida por defecto") : " desactivado");
      }).join(" · ") + " · " + sf.firewall.inbound_rules + " reglas de entrada.";
    }
    var det = el("details", { class: "more-table" }, [el("summary", { text: "Ver la tabla completa de puertos" }),
      el("div", { style: "margin:12px 0 8px" }, [toggle]),
      rows.length ? el("div", { class: "table-wrap" }, [tbl]) : el("p", { class: "empty", text: "Ningún servicio escucha en la red." })]);
    if (S.showLocal) det.setAttribute("open", "");
    app.appendChild(el("section", null, [card("Puertos a la escucha", [el("p", { class: "note", style: "margin:0", text: fwNote }), det])]));

    var shares = sf.shares.length ? el("ul", { class: "prio" }, sf.shares.map(function (sh) {
      var acc = (sh.access || []).map(function (a) { return a.account + ": " + a.right + (a.deny ? " (denegado)" : ""); }).concat(sh.options || []);
      return el("li", null, [el("span", { class: "tag", text: sh.kind }), el("div", null, [el("span", { class: "t", text: sh.name }), sh.path && sh.path !== sh.name ? el("span", { class: "id", text: sh.path }) : null]),
        el("div", { class: "d", text: acc.join(" · ") })]);
    })) : el("p", { class: "empty", text: "Sin recursos compartidos." });
    var admins = sf.admins.length ? el("ul", { class: "prio" }, sf.admins.map(function (a) {
      return el("li", null, [el("span", { class: "tag", text: a.source || a.kind || "admin" }), el("span", { class: "t", text: a.name })]);
    })) : el("p", { class: "empty", text: "No se pudieron leer los administradores." });
    app.appendChild(el("section", { class: "two" }, [card("Recursos compartidos", [shares]), card("Quién tiene las llaves (administradores)", [admins])]));
    (sf.notes || []).forEach(function (n) { app.appendChild(el("div", { class: "banner" }, [el("span", { class: "ico", text: "!" }), el("span", { text: n })])); });
  }

  // De dónde viene el ejecutable de un puerto: firma (Windows) o paquete (Linux).
  function originLine(p) {
    var t = { valid: "firmado por " + (p.signer || "?"), unsigned: "sin firma digital", invalid: "firma no válida",
      untrusted: "certificado sin confianza" + (p.signer ? ": " + p.signer : ""), package: "paquete " + (p.signer || "?"),
      unpackaged: "fuera de los paquetes" }[p.signature];
    if (!t) return null;
    var color = p.signature === "invalid" ? "var(--critical)" : (p.signature === "unsigned" || p.signature === "untrusted" || p.signature === "unpackaged") ? "var(--serious-text)" : null;
    return el("div", { class: "sub", text: t, title: p.path || "", style: color ? "color:" + color : null });
  }

  // ---- Rondas (historial) ----
  function scheduleCard() {
    var x = S.schedule;
    if (x === null) return card("Ronda diaria", [loadingBox("Consultando el planificador…")]);
    var st = x.status || {}, body = [];
    if (x.unsupported) {
      body.push(el("p", { class: "empty", text: "Este sistema no tiene un planificador compatible." }));
    } else if (!st.mechanism && st.detail) {
      body.push(el("p", { style: "color:var(--critical)", text: st.detail }));
    } else if (!st.mechanism) {
      body.push(el("p", { text: "No hay ronda diaria. Con ella, la historia de la muralla se llena sola y te aviso cuando aparece una brecha nueva o se abre una puerta." }));
      body.push(cmdBox(CLI + " schedule enable"));
    } else {
      body.push(el("p", null, [el("strong", { text: st.enabled ? "Ronda diaria a las " + st.at : "Programada pero desactivada" }),
        " · " + st.mechanism + (st.next_run ? " · próxima: " + st.next_run : "")]));
      if (st.detail) body.push(el("p", { class: "note", text: st.detail }));
      if (x.notify) body.push(el("p", { class: "note", text: "Avisos: " + x.notify + "." }));
    }
    var runs = (x.runs || []).slice().reverse();
    if (runs.length) {
      var t = el("table", null, [el("thead", null, [el("tr", null, ["Ronda", "Muralla", "Exposición", "Resultado"].map(function (h, i) {
        return el("th", { text: h, style: i === 1 || i === 2 ? "text-align:right" : null });
      }))])]);
      var b = el("tbody");
      runs.forEach(function (r) {
        var worse = [];
        if (r.regressions) worse.push(plural(r.regressions, "brecha nueva", "brechas nuevas"));
        if (r.new_exposure) worse.push(plural(r.new_exposure, "puerta más expuesta", "puertas más expuestas"));
        var res = r.errors && r.errors.length ? el("span", { style: "color:var(--critical)", text: "error: " + r.errors.join("; ") }) :
          worse.length ? el("span", { style: "color:var(--critical)", text: worse.join(", ") }) : el("span", { class: "sub", text: "sin novedad" });
        if (r.notify_errors && r.notify_errors.length) res = el("span", null, [res, el("div", { class: "sub", text: "aviso no enviado: " + r.notify_errors.join("; ") })]);
        b.appendChild(el("tr", null, [el("td", { text: fmtDate(r.time) }), el("td", { class: "num", text: r.scan_score + " %" }),
          el("td", { class: "num", text: r.surface_score + "/100" }), el("td", null, [res])]));
      });
      t.appendChild(b);
      body.push(el("div", { class: "table-wrap" }, [t]));
    }
    return card("Ronda diaria", body);
  }

  function renderHistory() {
    app.appendChild(el("section", null, [scheduleCard()]));
    var rows = S.reports.slice().reverse();
    var tbl = el("table", null, [el("thead", null, [el("tr", null, ["Fecha", "Perfil", "Muralla", "Cambio", "Brechas", "Sin revisar", ""].map(function (h, i) {
      return el("th", { text: h, style: i >= 2 && i <= 5 ? "text-align:right" : null });
    }))])]);
    var tb = el("tbody");
    rows.forEach(function (m, i) {
      var prev = rows[i + 1], d = prev && scored(m.score) && scored(prev.score) ? m.score.value - prev.score.value : null;
      tb.appendChild(el("tr", { class: m.id === S.reportId ? "current" : null }, [
        el("td", null, [el("div", { text: fmtDate(m.finished_at) }), el("div", { class: "sub", text: BRAND + " " + m.version })]),
        el("td", { text: m.profile_name || m.profile }),
        el("td", { class: "num" }, scored(m.score) ? [el("strong", { text: m.score.value + " % ", style: "color:" + scoreColor(m.score.value) }), m.score.grade] : ["sin evaluar"]),
        el("td", { class: "num", text: d === null ? "—" : (d > 0 ? "+" + d : String(d)), style: d > 0 ? "color:var(--good-text)" : d < 0 ? "color:var(--critical)" : null }),
        el("td", { class: "num", text: String(m.score.failed) }),
        el("td", { class: "num", text: String((m.score.skipped || 0) + (m.score.errors || 0)) }),
        el("td", { style: "text-align:right" }, [m.id === S.reportId ? el("span", { class: "sub", text: "en pantalla" }) :
          el("button", { class: "btn copy", type: "button", text: "Ver", onclick: function () { openReport(m.id).then(function () { go("panel"); }); } })])
      ]));
    });
    tbl.appendChild(tb);
    app.appendChild(el("section", null, [card("Rondas", [rows.length ? el("div", { class: "table-wrap" }, [tbl]) : el("p", { class: "empty", text: "Todavía no hay rondas guardadas." }),
      el("p", { class: "note", text: "Guardo las últimas rondas en " + S.info.reports_dir + "." })], el("span", { text: plural(rows.length, "ronda", "rondas") }))]));

    var changes;
    if (S.changes === null) changes = loadingBox("Cargando…");
    else if (!S.changes.length) changes = el("p", { class: "empty", text: "Todavía no he reparado nada en este equipo." });
    else {
      var t2 = el("table", null, [el("thead", null, [el("tr", null, ["Reparación", "Fecha", "Ola", "Estado", "Verificados", "Fallidos", "Deshechos"].map(function (h, i) {
        return el("th", { text: h, style: i >= 4 ? "text-align:right" : null });
      }))])]);
      var b2 = el("tbody");
      S.changes.forEach(function (c) {
        b2.appendChild(el("tr", null, [el("td", { class: "mono", text: c.id }), el("td", { text: fmtDate(c.created_at) }), el("td", { text: String(c.wave) }),
          el("td", null, [CHANGE[c.status] || c.status, c.reboot ? el("div", { class: "sub", text: "requiere reinicio" }) : null,
            c.nothing ? el("div", { class: "sub", text: c.nothing + (c.nothing === 1 ? " control ya estaba" : " controles ya estaban") + " en su sitio al aplicar" }) : null]),
          el("td", { class: "num", text: String(c.verified) }), el("td", { class: "num", text: String(c.failed) }), el("td", { class: "num", text: String(c.rolled_back) })]));
      });
      t2.appendChild(b2);
      changes = el("div", null, [el("div", { class: "table-wrap" }, [t2]), cmdBox(CLI + " rollback " + S.changes[0].id),
        el("p", { class: "note", text: "Deshacer se hace desde " + sudoWhere() + " (sin ID, deshace la última)." })]);
    }
    app.appendChild(el("section", null, [card("Reparaciones aplicadas", [changes])]));
  }

  // ---- Excepciones ----
  function renderExceptions() {
    var body;
    var titles = {};
    (S.report.results || []).forEach(function (x) { titles[x.rule.id] = x.rule.title; });
    if (S.exceptions === null) body = loadingBox("Cargando…");
    else if (!S.exceptions.length) body = el("p", { class: "empty", text: "No hay excepciones. Úsalas para aceptar por escrito una brecha que tiene un buen motivo." });
    else {
      var t = el("table", null, [el("thead", null, [el("tr", null, ["Control", "Vigencia", "Responsable", "Equipos", "Motivo"].map(function (h) { return el("th", { text: h }); }))])]);
      var tb = el("tbody");
      S.exceptions.forEach(function (x) {
        var state = x.expired ? el("span", { style: "color:var(--critical);font-weight:600", text: "Caducada el " + x.expires }) :
          el("span", { style: x.days_left <= 30 ? "color:var(--serious-text);font-weight:600" : null, text: "Hasta el " + x.expires + " (" + plural(x.days_left, "día", "días") + ")" });
        tb.appendChild(el("tr", null, [el("td", null, [el("div", { class: "mono", text: x.rule }), titles[x.rule] ? el("div", { class: "sub", text: titles[x.rule] }) : null]),
          el("td", null, [state, el("div", { class: "sub", text: "creada el " + x.created })]), el("td", { text: x.owner || "—" }),
          el("td", { text: x.hosts && x.hosts.length ? x.hosts.join(", ") : "todos" }), el("td", { text: x.reason })]));
      });
      t.appendChild(tb);
      body = el("div", { class: "table-wrap" }, [t]);
    }
    app.appendChild(el("section", null, [card("Excepciones", [body,
      el("p", { class: "note", style: "margin-top:16px", text: "Se gestionan desde " + sudoWhere() + ". Cada excepción caduca como mucho al año; al caducar, la brecha vuelve a contar." }),
      cmdBox(CLI + ' exceptions add <ID> --reason "motivo" --expires 90d'), cmdBox(CLI + " exceptions remove <ID>")])]));
  }

  // ---- Arranque ----
  route();
  busy(true);
  Promise.all([api("/api/state"), api("/api/reports")]).then(function (res) {
    S.info = res[0]; S.reports = res[1];
    document.title = BRAND + " · " + S.info.hostname;
    var last = S.reports[S.reports.length - 1];
    // Sin rondas recientes (última hora) se hace una al abrir.
    if (!last || Date.now() - new Date(last.finished_at).getTime() > 3600 * 1000) {
      // Se hace la ronda y se cargan a la vez los datos de la pestaña abierta
      // (el servidor los sirve en cuanto termina).
      busy(false); scan(); route(); return;
    }
    S.latestId = last.id;
    return openReport(last.id).then(function () { route(); });
  }).catch(function (e) {
    S.error = "No puedo hablar con " + BRAND + ": " + e.message + ". ¿Sigue abierta la terminal con " + CLI + " ui?";
    render();
  }).then(function () { busy(false); });
})();
</script>
</body>
