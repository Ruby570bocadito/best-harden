          el("p", { class: "note", text: "Aplicar se hace desde la terminal " + (S.info.family === "windows" ? "(PowerShell como administrador)" : "(sudo)") +
            ": Bastion pide confirmación, guarda una instantánea, verifica cada control y revierte el que falle. Para deshacerlo todo: bastion rollback." })]));
      }
    }
    app.appendChild(el("section", null, [card("Plan de hardening", body,
      S.plan.items ? el("span", { text: plural(S.plan.items.filter(function (i) { return i.status === "planned"; }).length, "cambio", "cambios") + " en la ola " + S.plan.wave }) : null)]));
  }

  // ---- Superficie de ataque ----
  function renderSurface() {
    var sf = S.surface;
    var again = el("button", { class: "btn copy", type: "button", text: "Volver a analizar", disabled: S.surfaceLoading ? "disabled" : null, onclick: function () { loadSurface(); } });
    if (!sf) {
      app.appendChild(el("section", null, [card("Superficie de ataque", [S.surfaceLoading ? loadingBox("Analizando puertos, recursos compartidos y administradores…") :
        el("p", { class: "empty", text: "No se pudo analizar la superficie." })], again)]));
      return;
    }
    var color = scoreColor(sf.score), sev = { critical: 0, high: 0, medium: 0, low: 0 };
    sf.findings.forEach(function (f) { if (f.severity in sev) sev[f.severity]++; });
    var hero = el("div", { class: "card hero" }, [el("h2", { text: "Exposición en la red" }), el("div", null, [
      el("div", { class: "hero-figure" }, [el("span", { class: "num", text: String(sf.score) }), el("span", { class: "of", text: "/ 100" }),
        el("span", { class: "grade", text: sf.grade, style: "color:" + color })]),
      el("div", { class: "meter" }, [el("i", { style: "width:" + sf.score + "%;background:" + color })]),
      el("p", { text: sf.exposed + " servicios escuchan en la red" + (sf.firewall ? ": " + (sf.reachable - (sf.limited || 0)) + " abiertos a cualquiera, " +
        (sf.limited || 0) + " limitados a ciertas redes y " + (sf.exposed - sf.reachable) + " filtrados por el firewall" : "") +
        ". Cada hallazgo resta según su severidad (crítico 30, alto 15, medio 7, bajo 3)." + (sf.firewall ? "" : " No se ha podido evaluar el firewall.") })])]);
    var kpis = el("div", { class: "kpis" });
    [["critical", "Críticos"], ["high", "Altos"], ["medium", "Medios"], ["low", "Bajos"]].forEach(function (k) {
      kpis.appendChild(el("div", { class: "card kpi" }, [el("div", { class: "label" }, [dot(SEV[k[0]].color), k[1]]),
        el("div", { class: "value", text: String(sev[k[0]]) }), el("div", { class: "sub", text: "hallazgos" })]));
    });
    app.appendChild(el("div", { class: "hero-row" }, [hero, kpis]));

    // Cambios desde el último análisis guardado (bastion surface --save).
    if (sf.changes) {
      var KIND = {
        worse: ["↑", "var(--critical)", ""], "new": ["+", "var(--critical)", ""], finding: ["!", "var(--critical)", "Hallazgo nuevo: "],
        better: ["↓", "var(--good-text)", ""], gone: ["−", "var(--good-text)", ""], resolved: ["✓", "var(--good-text)", "Resuelto: "]
      };
      var chItems = sf.changes.items || [];
      var chBody = chItems.length ? el("div", null, chItems.map(function (c) {
        var k = KIND[c.kind] || ["·", "var(--muted)", ""];
        return el("div", { class: "item" }, [el("div", { class: "h" }, [el("b", { text: k[0], style: "color:" + k[1] }), el("span", { class: "t", text: k[2] + c.title })])]);
      })) : el("p", { class: "empty", text: "Sin cambios en la exposición." });
      var chTitle = "Cambios desde el " + fmtDate(sf.changes.since) + (sf.changes.score_before !== sf.score ? " · exposición " + sf.changes.score_before + " → " + sf.score : "");
      app.appendChild(el("section", null, [card(chTitle, [chBody])]));
    }

    var finds = sf.findings.length ? el("div", null, sf.findings.map(function (f) {
      return el("div", { class: "item" }, [
        el("div", { class: "h" }, [sevBadge(f.severity), el("span", { class: "t", text: f.title }), el("span", { class: "rid", text: f.subject })]),
        el("p", { text: f.detail }), el("p", { style: "color:var(--good-text)", text: "→ " + f.fix })]);
    })) : el("p", { class: "empty", text: "Ningún servicio de riesgo expuesto ni recurso compartido abierto a todos." });
    app.appendChild(el("section", null, [card("Hallazgos", [finds], again)]));

    var ports = sf.ports || [];
    var hidden = ports.filter(function (p) { return p.scope !== "network" || p.ephemeral; }).length;
    var rows = ports.filter(function (p) { return S.showLocal || (p.scope === "network" && !p.ephemeral); });
    var heads = ["Puerto", "Dirección", "Alcance"].concat(sf.firewall ? ["Firewall"] : [], ["Proceso", "Servicio"]);
    var tbl = el("table", null, [el("thead", null, [el("tr", null, heads.map(function (h) { return el("th", { text: h }); }))])]);
    var tb = el("tbody");
    rows.forEach(function (p) {
      var proc = (p.process || "?") + (p.pid ? " (" + p.pid + ")" : "");
      var scope = p.ephemeral ? el("span", { class: "sub", text: "cliente" }) : p.scope === "network" ?
        el("span", { style: "color:var(--serious);font-weight:600", text: "red" }) : el("span", { class: "sub", text: "local" });
      var cells = [el("td", { class: "mono", text: p.port + "/" + p.proto }), el("td", { class: "mono", text: (p.addresses || []).join(", ") }), el("td", null, [scope])];
      if (sf.firewall) {
        cells.push(el("td", { title: p.firewall_why || "" }, [p.firewall === "open" ? el("span", { style: "color:var(--critical);font-weight:600", text: "abierto" }) :
          p.firewall === "limited" ? el("span", { style: "color:var(--serious);font-weight:600", text: "limitado: " + (p.firewall_limit || "") }) :
          p.firewall === "filtered" ? el("span", { style: "color:var(--good-text);font-weight:600", text: "filtrado" }) : el("span", { class: "sub", text: "—" }),
          p.firewall_why ? el("div", { class: "sub", text: p.firewall_why }) : null]));
      }
      cells.push(el("td", null, [el("div", { text: proc }), p.services && p.services.length ? el("div", { class: "sub", text: p.services.join(", ") }) : null, originLine(p)]),
        el("td", { text: p.known || "" }));
      tb.appendChild(el("tr", null, cells));
    });
    tbl.appendChild(tb);
    var toggle = el("button", { class: "btn copy", type: "button", text: S.showLocal ? "Solo los de la red" : "Mostrar también locales y de cliente (" + hidden + ")",
      onclick: function () { S.showLocal = !S.showLocal; render(); } });
    var fwNote = "Sin evaluar el firewall, cada puerto en la red se muestra como accesible, aunque puede estar filtrado.";
    if (sf.firewall && sf.firewall.source && sf.firewall.source.indexOf("tables") >= 0) {
      fwNote = "Firewall de Linux (" + sf.firewall.source + "): " + (sf.firewall.input_policy === "drop" ? "entrada bloqueada por defecto" :
        sf.firewall.input_policy === "accept" ? "entrada permitida por defecto" : "sin reglas de entrada") + " · " + sf.firewall.inbound_rules + " reglas de entrada.";
    } else if (sf.firewall) {
      fwNote = "Firewall de Windows: " + (sf.firewall.profiles || []).filter(function (p) { return p.active; }).map(function (p) {
        return "perfil " + p.name + (p.enabled ? (p.block_inbound ? " activo, entrada bloqueada por defecto" : " activo, entrada permitida por defecto") : " desactivado");
      }).join(" · ") + " · " + sf.firewall.inbound_rules + " reglas de entrada.";
    }
    app.appendChild(el("section", null, [card(S.showLocal ? "Puertos a la escucha" : "Servicios en la red",
      [rows.length ? el("div", { class: "table-wrap" }, [tbl]) : el("p", { class: "empty", text: "Ningún servicio escucha en la red." }),
        el("p", { class: "note", text: fwNote })], toggle)]));

    var shares = sf.shares.length ? el("ul", { class: "prio" }, sf.shares.map(function (sh) {
      var acc = (sh.access || []).map(function (a) { return a.account + ": " + a.right + (a.deny ? " (denegado)" : ""); }).concat(sh.options || []);
      return el("li", null, [el("span", { class: "tag", text: sh.kind }), el("div", null, [el("span", { class: "t", text: sh.name }), sh.path && sh.path !== sh.name ? el("span", { class: "id", text: sh.path }) : null]),
        el("div", { class: "d", text: acc.join(" · ") })]);
    })) : el("p", { class: "empty", text: "Sin recursos compartidos." });
    var admins = sf.admins.length ? el("ul", { class: "prio" }, sf.admins.map(function (a) {
      return el("li", null, [el("span", { class: "tag", text: a.source || a.kind || "admin" }), el("span", { class: "t", text: a.name })]);
    })) : el("p", { class: "empty", text: "No se pudieron leer los administradores." });
    app.appendChild(el("section", { class: "two" }, [card("Recursos compartidos", [shares]), card("Administradores", [admins])]));
    (sf.notes || []).forEach(function (n) { app.appendChild(el("div", { class: "banner" }, [el("span", { class: "ico", text: "!" }), el("span", { text: n })])); });
  }

  // ---- Historial ----
  // De dónde viene el ejecutable de un puerto: firma (Windows) o paquete (Linux).
  function originLine(p) {
    var t = { valid: "firmado por " + (p.signer || "?"), unsigned: "sin firma digital", invalid: "firma no válida",
      untrusted: "certificado sin confianza" + (p.signer ? ": " + p.signer : ""), package: "paquete " + (p.signer || "?"),
      unpackaged: "fuera de los paquetes" }[p.signature];
    if (!t) return null;
    var color = p.signature === "invalid" ? "var(--critical)" : (p.signature === "unsigned" || p.signature === "untrusted" || p.signature === "unpackaged") ? "var(--serious)" : null;
    return el("div", { class: "sub", text: t, title: p.path || "", style: color ? "color:" + color : null });
  }

  function scheduleCard() {
    var x = S.schedule;
    if (x === null) return card("Análisis programado", [loadingBox("Consultando el planificador…")]);
    var st = x.status || {}, body = [];
    if (x.unsupported) {
      body.push(el("p", { class: "empty", text: "Este sistema no tiene un planificador compatible." }));
    } else if (!st.mechanism && st.detail) {
      body.push(el("p", { style: "color:var(--critical)", text: st.detail }));
    } else if (!st.mechanism) {
      body.push(el("p", { text: "No hay análisis programado. Con uno diario, el historial se llena solo y Bastion avisa de los controles que empeoran y de los puertos que se abren." }));
      body.push(cmdBox("bastion schedule enable"));
    } else {
      body.push(el("p", null, [el("strong", { text: st.enabled ? "Diario a las " + st.at : "Programado pero desactivado" }),
        " · " + st.mechanism + (st.next_run ? " · próxima ejecución: " + st.next_run : "")]));
      if (st.detail) body.push(el("p", { class: "note", text: st.detail }));
      if (x.notify) body.push(el("p", { class: "note", text: "Avisos: " + x.notify + "." }));
    }
    var runs = (x.runs || []).slice().reverse();
    if (runs.length) {
      var t = el("table", null, [el("thead", null, [el("tr", null, ["Ejecución", "Postura", "Exposición", "Resultado"].map(function (h, i) {
        return el("th", { text: h, style: i === 1 || i === 2 ? "text-align:right" : null });
      }))])]);
      var b = el("tbody");
      runs.forEach(function (r) {
        var worse = [];
        if (r.regressions) worse.push(plural(r.regressions, "control empeorado", "controles empeorados"));
        if (r.new_exposure) worse.push(plural(r.new_exposure, "cambio que aumenta la exposición", "cambios que aumentan la exposición"));
        var res = r.errors && r.errors.length ? el("span", { style: "color:var(--critical)", text: "error: " + r.errors.join("; ") }) :
          worse.length ? el("span", { style: "color:var(--critical)", text: worse.join(", ") }) : el("span", { class: "sub", text: "sin empeorar" });
        if (r.notify_errors && r.notify_errors.length) res = el("span", null, [res, el("div", { class: "sub", text: "aviso no enviado: " + r.notify_errors.join("; ") })]);
        b.appendChild(el("tr", null, [el("td", { text: fmtDate(r.time) }), el("td", { class: "num", text: r.scan_score + "/100" }),
          el("td", { class: "num", text: r.surface_score + "/100" }), el("td", null, [res])]));
      });
      t.appendChild(b);
      body.push(el("div", { class: "table-wrap" }, [t]));
    }
    return card("Análisis programado", body);
  }

  function renderHistory() {
    app.appendChild(el("section", null, [scheduleCard()]));
    var rows = S.reports.slice().reverse();
    var tbl = el("table", null, [el("thead", null, [el("tr", null, ["Fecha", "Perfil", "Puntuación", "Cambio", "Fallidos", "Sin evaluar", ""].map(function (h, i) {
      return el("th", { text: h, style: i >= 2 && i <= 5 ? "text-align:right" : null });
    }))])]);
    var tb = el("tbody");
    rows.forEach(function (m, i) {
      var prev = rows[i + 1], d = prev && scored(m.score) && scored(prev.score) ? m.score.value - prev.score.value : null;
      tb.appendChild(el("tr", { class: m.id === S.reportId ? "current" : null }, [
        el("td", null, [el("div", { text: fmtDate(m.finished_at) }), el("div", { class: "sub", text: "Bastion " + m.version })]),
        el("td", { text: m.profile_name || m.profile }),
        el("td", { class: "num" }, scored(m.score) ? [el("strong", { text: m.score.value + " ", style: "color:" + scoreColor(m.score.value) }), m.score.grade] : ["sin evaluar"]),
        el("td", { class: "num", text: d === null ? "—" : (d > 0 ? "+" + d : String(d)), style: d > 0 ? "color:var(--good-text)" : d < 0 ? "color:var(--critical)" : null }),
        el("td", { class: "num", text: String(m.score.failed) }),
        el("td", { class: "num", text: String((m.score.skipped || 0) + (m.score.errors || 0)) }),
        el("td", { style: "text-align:right" }, [m.id === S.reportId ? el("span", { class: "sub", text: "en pantalla" }) :
          el("button", { class: "btn copy", type: "button", text: "Ver", onclick: function () { openReport(m.id).then(function () { go("panel"); }); } })])
      ]));
    });
    tbl.appendChild(tb);
    app.appendChild(el("section", null, [card("Escaneos", [rows.length ? el("div", { class: "table-wrap" }, [tbl]) : el("p", { class: "empty", text: "Sin escaneos guardados." }),
      el("p", { class: "note", text: "Se conservan los últimos escaneos en " + S.info.reports_dir + "." })], el("span", { text: plural(rows.length, "escaneo", "escaneos") }))]));

    var changes;
    if (S.changes === null) changes = loadingBox("Cargando…");
    else if (!S.changes.length) changes = el("p", { class: "empty", text: "Todavía no se ha aplicado ningún cambio de hardening en este equipo." });
    else {
      var t2 = el("table", null, [el("thead", null, [el("tr", null, ["Cambio", "Fecha", "Ola", "Estado", "Verificados", "Fallidos", "Deshechos"].map(function (h, i) {
        return el("th", { text: h, style: i >= 4 ? "text-align:right" : null });
      }))])]);
      var b2 = el("tbody");
      S.changes.forEach(function (c) {
        b2.appendChild(el("tr", null, [el("td", { class: "mono", text: c.id }), el("td", { text: fmtDate(c.created_at) }), el("td", { text: String(c.wave) }),
          el("td", null, [CHANGE[c.status] || c.status, c.reboot ? el("div", { class: "sub", text: "requiere reinicio" }) : null,
            c.nothing ? el("div", { class: "sub", text: c.nothing + (c.nothing === 1 ? " control ya estaba" : " controles ya estaban") + " en su sitio al aplicar" }) : null]),
          el("td", { class: "num", text: String(c.verified) }), el("td", { class: "num", text: String(c.failed) }), el("td", { class: "num", text: String(c.rolled_back) })]));
      });
      t2.appendChild(b2);
      changes = el("div", null, [el("div", { class: "table-wrap" }, [t2]), cmdBox("bastion rollback " + S.changes[0].id),
        el("p", { class: "note", text: "Deshacer un cambio se hace desde la terminal con privilegios (sin ID, deshace el último)." })]);
    }
    app.appendChild(el("section", null, [card("Cambios de hardening", [changes])]));
  }

  // ---- Excepciones ----
  function renderExceptions() {
    var body;
    var titles = {};
    (S.report.results || []).forEach(function (x) { titles[x.rule.id] = x.rule.title; });
    if (S.exceptions === null) body = loadingBox("Cargando…");
    else if (!S.exceptions.length) body = el("p", { class: "empty", text: "No hay excepciones. Úsalas para aceptar de forma documentada un control que falla por un buen motivo." });
    else {
      var t = el("table", null, [el("thead", null, [el("tr", null, ["Control", "Vigencia", "Responsable", "Equipos", "Motivo"].map(function (h) { return el("th", { text: h }); }))])]);
      var tb = el("tbody");
      S.exceptions.forEach(function (x) {
        var state = x.expired ? el("span", { style: "color:var(--critical);font-weight:600", text: "Caducada el " + x.expires }) :
          el("span", { style: x.days_left <= 30 ? "color:var(--serious);font-weight:600" : null, text: "Hasta el " + x.expires + " (" + plural(x.days_left, "día", "días") + ")" });
        tb.appendChild(el("tr", null, [el("td", null, [el("div", { class: "mono", text: x.rule }), titles[x.rule] ? el("div", { class: "sub", text: titles[x.rule] }) : null]),
          el("td", null, [state, el("div", { class: "sub", text: "creada el " + x.created })]), el("td", { text: x.owner || "—" }),
          el("td", { text: x.hosts && x.hosts.length ? x.hosts.join(", ") : "todos" }), el("td", { text: x.reason })]));
      });
      t.appendChild(tb);
      body = el("div", { class: "table-wrap" }, [t]);
    }
    app.appendChild(el("section", null, [card("Excepciones", [body,
      el("p", { class: "note", style: "margin-top:16px", text: "Se gestionan desde la terminal con privilegios. Cada excepción caduca como mucho al año; al caducar, el control vuelve a contar como fallido." }),
      cmdBox('bastion exceptions add <ID> --reason "motivo" --expires 90d'), cmdBox("bastion exceptions remove <ID>")])]));
  }

  // ---- Arranque ----
  route();
  busy(true);
  Promise.all([api("/api/state"), api("/api/reports")]).then(function (res) {
    S.info = res[0]; S.reports = res[1];
    document.title = "Bastion · " + S.info.hostname;
    var last = S.reports[S.reports.length - 1];
    // Sin escaneos recientes (última hora) se escanea al abrir.
    if (!last || Date.now() - new Date(last.finished_at).getTime() > 3600 * 1000) {
      // Se escanea y se cargan a la vez los datos de la pestaña abierta (el
      // servidor los sirve en cuanto termina el escaneo).
      busy(false); scan(); route(); return;
    }
    S.latestId = last.id;
    return openReport(last.id).then(function () { route(); });
  }).catch(function (e) {
    S.error = "No se pudo conectar con Bastion: " + e.message + ". ¿Sigue abierta la terminal con bastion ui?";
    render();
  }).then(function () { busy(false); });
})();
</script>
</body>
</html>
