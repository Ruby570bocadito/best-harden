  var third = !unk && sc.exceptions ? ["exception", sc.exceptions, "Excepciones", "riesgo aceptado con caducidad"] :
    [sc.skipped ? "skipped" : "error", unk, "Sin evaluar", unkSub];
  [["fail", sc.failed, "Fallidos", "requieren acción"], ["pass", sc.passed, "Superados", "conformes"],
   third, ["na", sc.na, "No aplican", "fuera del alcance de este equipo"]]
    .forEach(function (k) {
      var st = STATUS[k[0]];
      kpis.appendChild(el("div", { class: "card kpi" }, [
        el("div", { class: "label" }, [el("span", { text: st.icon, style: "color:" + st.color + ";font-weight:700" }), k[2]]),
        el("div", { class: "value", text: String(k[1]) }),
        el("div", { class: "sub", text: k[3] })
      ]));
    });
  app.appendChild(el("div", { class: "hero-row" }, [hero, kpis]));

  // ---- Cambios desde el último escaneo guardado del mismo perfil ----
  var ch = data.changes;
  if (ch && ((ch.regressions || []).length || (ch.fixed || []).length)) {
    var chList = el("ol", { class: "prio" });
    (ch.regressions || []).forEach(function (c) {
      chList.appendChild(el("li", null, [sevBadge(c.severity),
        el("div", null, [el("span", { class: "t", text: c.title }), el("span", { class: "id", text: c.id })]),
        el("div", { class: "d", style: "color:var(--critical)", text: "Ha empeorado: antes se superaba y ahora falla." })]));
    });
    (ch.fixed || []).forEach(function (c) {
      chList.appendChild(el("li", null, [statusBadge("pass"),
        el("div", null, [el("span", { class: "t", text: c.title }), el("span", { class: "id", text: c.id })]),
        el("div", { class: "d", text: "Corregido desde el escaneo anterior." })]));
    });
    var chTitle = "Cambios desde el " + fmtDate(ch.since) + (ch.score_before !== sc.value ? " · postura " + ch.score_before + " → " + sc.value : "");
    app.appendChild(el("section", null, [el("div", { class: "card" }, [el("h2", { text: chTitle }), chList])]));
  }

  // ---- Prioridades + severidad ----
  var failed = results.filter(function (r) { return r.status === "fail"; });
  var prio = el("ol", { class: "prio" });
  failed.slice().sort(function (a, b) {
    return (SEV[a.rule.severity].rank - SEV[b.rule.severity].rank) ||
      (["none", "low", "medium", "high"].indexOf(a.rule.remediation.breaking_risk) - ["none", "low", "medium", "high"].indexOf(b.rule.remediation.breaking_risk));
  }).slice(0, 6).forEach(function (r) {
    prio.appendChild(el("li", null, [
      sevBadge(r.rule.severity),
      el("div", null, [el("span", { class: "t", text: r.rule.title }), el("span", { class: "id", text: r.rule.id })]),
      el("div", { class: "d", text: r.rule.remediation.summary + " · Riesgo de rotura: " + (RISK[r.rule.remediation.breaking_risk] || "—").toLowerCase() })
    ]));
  });
  var prioCard = el("div", { class: "card" }, [el("h2", { text: "Empieza por aquí" }),
    failed.length ? prio : el("p", { class: "empty", text: "Sin controles fallidos. ¡Buen trabajo!" })]);

  var sevCard = el("div", { class: "card" }, [el("h2", { text: "Fallidos por severidad" })]);
  var bySev = sc.by_severity || {};
  var maxFail = 1;
  Object.keys(bySev).forEach(function (k) { maxFail = Math.max(maxFail, bySev[k].failed || 0); });
  ["critical", "high", "medium", "low"].forEach(function (s) {
    var c = bySev[s]; if (!c) return;
    var evaluated = (c.passed || 0) + (c.failed || 0);
    var bar = el("div", { class: "sev-bar" });
    if (c.failed > 0) bar.appendChild(el("i", { style: "width:" + Math.max(4, (c.failed / maxFail) * 100) + "%;background:" + SEV[s].color, title: c.failed + " fallidos de " + evaluated }));
    else bar.appendChild(el("span", { class: "ok-mark" }, [el("span", { text: "✓" }), "Todos conformes"]));
    sevCard.appendChild(el("div", { class: "sev-row" }, [sevBadge(s), bar, el("span", { class: "count", text: c.failed + " / " + evaluated })]));
  });
  app.appendChild(el("section", { class: "two" }, [prioCard, sevCard]));

  // ---- Categorías + ATT&CK ----
  var catCard = el("div", { class: "card" }, [el("h2", { text: "Puntuación por categoría" })]);
  (sc.by_category || []).forEach(function (c) {
    var ev = c.passed + c.failed;
    if (!ev) return;
    catCard.appendChild(el("div", { class: "cat-row" }, [
      el("div", null, [el("div", { text: c.name }), el("div", { class: "n", text: c.passed + " de " + ev + " conformes" })]),
      el("div", { class: "meter", title: c.name + ": " + c.value + "/100" }, [el("i", { style: "width:" + c.value + "%;background:" + scoreColor(c.value) })]),
      el("div", { class: "v", text: String(c.value) })
    ]));
  });

  var techs = {};
  failed.forEach(function (r) {
    ((r.rule.references || {}).mitre_techniques || []).forEach(function (t) {
      techs[t] = techs[t] || { id: t, n: 0, worst: 9 };
      techs[t].n++; techs[t].worst = Math.min(techs[t].worst, SEV[r.rule.severity].rank);
    });
  });
  var techList = Object.keys(techs).map(function (k) { return techs[k]; })
    .sort(function (a, b) { return a.worst - b.worst || b.n - a.n || (a.id < b.id ? -1 : 1); });
  var techWrap = el("div", { class: "techs" });
  techList.slice(0, 24).forEach(function (t) {
    var url = mitreURL(t.id);
    techWrap.appendChild(el("a", { class: "tech", href: url, target: "_blank", rel: "noopener noreferrer",
      title: "Técnica " + t.id + ": " + t.n + " control(es) fallido(s) la dejan sin mitigar" }, [
      el("span", { class: "tid", text: t.id }),
      el("span", { class: "tn" }, [dot(Object.keys(SEV).map(function (k) { return SEV[k]; })[t.worst].color), " " + t.n + (t.n === 1 ? " control" : " controles")])
    ]));
  });
  var attCard = el("div", { class: "card" }, [el("h2", { text: "Técnicas MITRE ATT&CK expuestas" }),
    techList.length ? techWrap : el("p", { class: "empty", text: "Ningún control fallido está asociado a técnicas ATT&CK." })]);
  if (techList.length > 24) attCard.appendChild(el("p", { class: "sub", style: "color:var(--muted);font-size:13px;margin:10px 0 0", text: "y " + (techList.length - 24) + " técnicas más en el detalle de los controles." }));
  app.appendChild(el("section", { class: "two" }, [catCard, attCard]));

  // ---- Controles ----
  var counts = { all: results.length, fail: 0, error: 0, skipped: 0, exception: 0, pass: 0, na: 0 };
  results.forEach(function (r) { counts[r.status]++; });
  var state = { status: counts.fail ? "fail" : "all", sev: "", cat: "", q: "" };

  var chips = el("div", { class: "chips", role: "group", "aria-label": "Filtrar por estado" });
  [["all", "Todos"], ["fail", "Fallidos"], ["error", "Errores"], ["skipped", "Sin evaluar"], ["exception", "Excepciones"], ["pass", "Superados"], ["na", "No aplican"]].forEach(function (c) {
    if ((c[0] === "error" || c[0] === "skipped" || c[0] === "exception") && !counts[c[0]]) return;
    var b = el("button", { class: "chip", type: "button", "data-s": c[0], "aria-pressed": String(state.status === c[0]) },
      [c[1], el("span", { class: "c", text: String(counts[c[0]]) })]);
    b.addEventListener("click", function () { state.status = c[0]; render(); });
    chips.appendChild(b);
  });
  var sevSel = el("select", { "aria-label": "Severidad" }, [el("option", { value: "", text: "Todas las severidades" })]);
  ["critical", "high", "medium", "low"].forEach(function (s) { sevSel.appendChild(el("option", { value: s, text: SEV[s].label })); });
  sevSel.addEventListener("change", function () { state.sev = sevSel.value; render(); });
  var cats = {}; results.forEach(function (r) { cats[r.rule.category] = 1; });
  var catSel = el("select", { "aria-label": "Categoría" }, [el("option", { value: "", text: "Todas las categorías" })]);
  Object.keys(cats).sort().forEach(function (c) { catSel.appendChild(el("option", { value: c, text: c })); });
  catSel.addEventListener("change", function () { state.cat = catSel.value; render(); });
  var search = el("input", { type: "search", placeholder: "Buscar por ID, título o técnica…", "aria-label": "Buscar" });
  search.addEventListener("input", function () { state.q = search.value.trim().toLowerCase(); render(); });

  var list = el("div", { class: "results" });
  app.appendChild(el("section", { class: "card", id: "controles" }, [el("h2", { text: "Controles evaluados" }),
    el("div", { class: "filters" }, [chips, sevSel, catSel, search]), list]));

  function evidence(ev) {
    var ul = el("ul", { class: "ev" });
    var items = ev.children && ev.children.length ? ev.children : [ev];
    items.forEach(function (c) {
      var li = el("li");
      var head = el("div", { class: "h" }, [statusBadge(c.status)]);
      if (c.label) head.appendChild(el("strong", { text: c.label }));
      if (c.source) head.appendChild(el("span", { class: "src mono", text: c.source }));
      li.appendChild(head);
      if (c.children && c.children.length) li.appendChild(evidence(c));
      else {
        var dl = el("dl", { class: "kv" });
        if (c.actual) { dl.appendChild(el("dt", { text: "Actual" })); dl.appendChild(el("dd", { class: "mono", text: c.actual })); }
        if (c.expected) { dl.appendChild(el("dt", { text: "Esperado" })); dl.appendChild(el("dd", { class: "mono", text: c.expected })); }
        if (c.message) { dl.appendChild(el("dt", { text: "Nota" })); dl.appendChild(el("dd", { text: c.message })); }
        if (dl.childNodes.length) li.appendChild(dl);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  function refs(r) {
    var ref = r.rule.references || {}, wrap = el("div", { class: "refs" });
    function add(prefix, arr, linker) {
      (arr || []).forEach(function (x) {
        var u = linker ? linker(x) : null;
        wrap.appendChild(u ? el("a", { class: "ref", href: u, target: "_blank", rel: "noopener noreferrer", text: x })
          : el("span", { class: "ref", text: prefix + x }));
      });
    }
    add("", ref.mitre_techniques, mitreURL);
    add("", ref.mitre_mitigations, mitreURL);
    add("NIST ", ref.nist);
    add("CIS ", ref.cis);
    add("STIG ", ref.stig);
    add("ENS ", ref.ens);
    return wrap;
  }

  function row(r) {
    var rule = r.rule, l = leaf(r);
    var d = el("details", { class: "res" });
    var sub = r.status === "pass" ? (l.actual ? "Actual: " + l.actual : "") :
      r.status === "fail" ? [l.label, l.actual ? "actual " + l.actual : "", l.expected ? "esperado " + l.expected : ""].filter(Boolean).join(" · ") :
      r.status === "exception" ? "Excepción hasta el " + r.exception.expires + " · " + r.exception.reason :
      (l.message || "");
    d.appendChild(el("summary", null, [
      statusBadge(r.status),
      el("span", { class: "rsev" }, [sevBadge(rule.severity)]),
      el("span", { class: "rid", text: rule.id }),
      el("span", { class: "rtitle" }, [rule.title, sub ? el("span", { class: "why", text: sub }) : null]),
      el("span", { class: "chev", text: "›", "aria-hidden": "true" })
    ]));
    var left = el("div", null, [
      el("h3", { text: "Descripción" }), el("p", { text: rule.description }),
      rule.rationale ? el("h3", { text: "Por qué importa" }) : null, rule.rationale ? el("p", { text: rule.rationale }) : null,
      el("h3", { text: "Evidencia" }), evidence(r)
    ]);
    var rem = rule.remediation || {};
    var right = el("div");
    if (r.exception) {
      var x = r.exception;
      right.appendChild(el("h3", { text: x.expired ? "Excepción caducada" : "Excepción" }));
      right.appendChild(el("div", { class: "impact" }, [
        el("div", { text: x.reason }),
        el("div", { style: "margin-top:6px;color:var(--muted);font-size:13px", text: [x.owner ? "Responsable: " + x.owner : "", "Creada el " + x.created,
          (x.expired ? "caducó el " : "vigente hasta el ") + x.expires, x.hosts && x.hosts.length ? "Equipos: " + x.hosts.join(", ") : ""].filter(Boolean).join(" · ") })
      ]));
    }
    right.appendChild(el("h3", { text: "Remediación" }));
    right.appendChild(el("p", { text: rem.summary }));
    if (rem.actions && rem.actions.length && r.status === "fail") {
      var wave = { medium: 2, high: 3 }[rem.breaking_risk] || 1;
      var cmdline = "bastion harden --rule " + rule.id + " --apply" + (wave > 1 ? " --wave " + wave : "") + (rem.safety === "remote-access" ? " --include-remote" : "");
      right.appendChild(el("h3", { text: "Corrección automática" }));
      right.appendChild(el("pre", null, [el("code", { text: cmdline })]));
      right.appendChild(el("p", { style: "font-size:13px;color:var(--muted);margin-top:6px", text: "Simula primero sin --apply. Bastion guarda el estado previo y lo revierte si el cambio falla o no surte efecto (bastion rollback para deshacer)." }));
    }
    if (rem.gpo) { right.appendChild(el("h3", { text: "Directiva de grupo (GPO)" })); right.appendChild(el("p", { class: "mono", text: rem.gpo })); }
    if (rem.commands) {
      right.appendChild(el("h3", { text: "Comandos" }));
      var copy = el("button", { class: "btn copy", type: "button", text: "Copiar" });
      var pre = el("pre", null, [el("code", { text: rem.commands }), copy]);
      copy.addEventListener("click", function (e) {
        e.preventDefault();
        if (navigator.clipboard) navigator.clipboard.writeText(rem.commands).then(function () { copy.textContent = "Copiado"; setTimeout(function () { copy.textContent = "Copiar"; }, 1500); });
      });
      right.appendChild(pre);
    }
    right.appendChild(el("h3", { text: "Riesgo de rotura" }));
    right.appendChild(el("p", { text: (RISK[rem.breaking_risk] || "—") + (rem.reboot_required ? " · requiere reinicio" : "") }));
    if (rule.impact) { right.appendChild(el("h3", { text: "Impacto" })); right.appendChild(el("div", { class: "impact", text: rule.impact })); }
    right.appendChild(el("h3", { text: "Referencias" }));
    right.appendChild(refs(r));
    d.appendChild(el("div", { class: "body" }, [left, right]));
    return d;
  }

  function matches(r) {
    if (state.status !== "all" && r.status !== state.status) return false;
    if (state.sev && r.rule.severity !== state.sev) return false;
    if (state.cat && r.rule.category !== state.cat) return false;
    if (state.q) {
      var ref = r.rule.references || {};
      var hay = [r.rule.id, r.rule.title, r.rule.category].concat(ref.mitre_techniques || [], ref.nist || []).join(" ").toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }

  function render() {
    Array.prototype.forEach.call(chips.children, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-s") === state.status)); });
    list.textContent = "";
    var shown = results.filter(matches);
    if (!shown.length) { list.appendChild(el("div", { class: "empty", text: "Ningún control coincide con los filtros." })); return; }
    shown.forEach(function (r) { list.appendChild(row(r)); });
  }
  render();
  // La consola local (bastion ui) abre el informe directamente en la lista.
  // Se usa ?view= y no un #fragmento: navegar a un fragmento dentro de un
  // iframe desplazaría también la consola.
  if (/[?&]view=controles(&|$)/.test(location.search)) window.scrollTo(0, document.getElementById("controles").getBoundingClientRect().top + window.scrollY - 72);

  app.appendChild(el("footer", null, [
    "Generado por Bastion " + ((data.tool && data.tool.version) || "") + " · formato " + data.schema +
    ". Bastion solo lee la configuración: no se ha modificado nada en el equipo. Revisa el impacto de cada cambio antes de aplicarlo en producción."
  ]));
})();
</script>
</body>
</html>
