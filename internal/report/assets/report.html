      copy.addEventListener("click", function (e) {
        e.preventDefault();
        if (navigator.clipboard) navigator.clipboard.writeText(rem.commands).then(function () { copy.textContent = "Copiado"; setTimeout(function () { copy.textContent = "Copiar"; }, 1500); });
      });
      right.appendChild(pre);
    }
    right.appendChild(el("h3", { text: "Riesgo de rotura" }));
    right.appendChild(el("p", { text: (RISK[rem.breaking_risk] || "—") + (rem.reboot_required ? " · requiere reinicio" : "") }));
    if (rule.impact) { right.appendChild(el("h3", { text: "Impacto" })); right.appendChild(el("div", { class: "impact", text: rule.impact })); }
    right.appendChild(el("h3", { text: "Referencias" }));
    right.appendChild(refs(r));
    d.appendChild(el("div", { class: "body" }, [left, right]));
    return d;
  }

  function matches(r) {
    if (state.status !== "all" && r.status !== state.status) return false;
    if (state.sev && r.rule.severity !== state.sev) return false;
    if (state.cat && r.rule.category !== state.cat) return false;
    if (state.q) {
      var ref = r.rule.references || {};
      var hay = [r.rule.id, r.rule.title, r.rule.category].concat(ref.mitre_techniques || [], ref.nist || []).join(" ").toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }

  function render() {
    Array.prototype.forEach.call(chips.children, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-s") === state.status)); });
    list.textContent = "";
    var shown = results.filter(matches);
    if (!shown.length) { list.appendChild(el("div", { class: "empty", text: "Ningún control coincide con los filtros." })); return; }
    shown.forEach(function (r) { list.appendChild(row(r)); });
  }
  render();
  // La consola local (adarve ui) abre el informe directamente en la lista.
  // Se usa ?view= y no un #fragmento: navegar a un fragmento dentro de un
  // iframe desplazaría también la consola.
  if (/[?&]view=controles(&|$)/.test(location.search)) window.scrollTo(0, document.getElementById("controles").getBoundingClientRect().top + window.scrollY - 72);

  app.appendChild(el("footer", null, [
    "Generado por Adarve " + ((data.tool && data.tool.version) || "") + " · formato " + data.schema +
    ". Adarve solo lee la configuración: no se ha modificado nada en el equipo. Revisa el impacto de cada cambio antes de aplicarlo en producción."
  ]));
})();
</script>
</body>
</html>
