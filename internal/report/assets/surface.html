<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="generator" content="Bastion">
<title>Superficie de ataque · Bastion</title>
<style>
__STYLE__
/* Superficie */
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--hair); }
.ptable td { padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; overflow-wrap: anywhere; }
.ptable td.port { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
.ptable .sub { color: var(--muted); font-size: 12.5px; }
.table-wrap { overflow-x: auto; }
.fw-open { color: var(--critical); font-weight: 600; }
.fw-limited { color: var(--serious); font-weight: 600; }
.fw-filtered { color: var(--good-text); font-weight: 600; }
.finding { padding: 14px 0; border-top: 1px solid var(--hair); display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.finding:first-child { border-top: 0; padding-top: 0; }
.finding > .badge { align-self: start; margin-top: 2px; }
.finding .t { font-weight: 560; }
.finding .s { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.finding .d, .finding .fix { grid-column: 2; color: var(--ink-2); font-size: 14px; margin: 0; }
.finding pre { grid-column: 2; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--hair); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .sub { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      Bastion <small>· superficie de ataque</small>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="print" type="button" title="Imprimir o guardar como PDF">Imprimir<span class="long"> / PDF</span></button>
    <button class="btn" id="theme" type="button" title="Cambiar tema">Tema</button>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<script type="application/json" id="bastion-data">__BASTION_DATA__</script>
<script nonce="__NONCE__">
(function () {
  "use strict";
  // Todo el contenido procedente del sistema auditado (nombres de procesos,
  // reglas, recursos compartidos…) se inserta con textContent: nunca se
  // interpreta como HTML.
  var data = JSON.parse(document.getElementById("bastion-data").textContent);
  var app = document.getElementById("app");
  var root = document.documentElement;

  var SEV = {
    critical: { label: "Crítico", color: "var(--critical)" },
    high: { label: "Alto", color: "var(--serious)" },
    medium: { label: "Medio", color: "var(--warning)" },
    low: { label: "Bajo", color: "var(--info)" },
    info: { label: "Info", color: "var(--info)" }
  };

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function dot(color) { return el("span", { class: "dot", style: "background:" + color }); }
  function badge(color, text) { return el("span", { class: "badge" }, [dot(color), text]); }
  function scoreColor(v) { return v >= 80 ? "var(--good)" : v >= 60 ? "var(--warning)" : "var(--critical)"; }
  function scoreWord(v) { return v >= 90 ? "Muy poca exposición" : v >= 80 ? "Exposición baja" : v >= 60 ? "Exposición moderada" : "Exposición alta"; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso; }
  }
  function card(title, children) { return el("section", { class: "card" }, [el("h2", { text: title })].concat(children)); }

  var fw = data.firewall || null;
  var host = data.host || {};
  var findings = data.findings || [];
  var ports = (data.ports || []).filter(function (p) { return p.scope === "network" && !p.ephemeral; });

  // ---- Equipo
  var meta = el("div", { class: "meta" }, [
    el("span", null, [el("b", { text: "Sistema" }), (function () {
      var n = host.name || host.os || "";
      return host.version && n.indexOf(host.version) < 0 ? n + " " + host.version : n;
    })()]),
    el("span", null, [el("b", { text: "Analizado" }), fmtDate(data.finished_at)]),
    el("span", null, [el("b", { text: "Bastion" }), data.version || ""])
  ]);
  if (fw) {
    var fwText;
    if (fw.source && fw.source.indexOf("tables") >= 0) {
      fwText = fw.source + " · " + (fw.input_policy === "drop" ? "entrada bloqueada por defecto" : fw.input_policy === "accept" ? "entrada permitida por defecto" : "sin reglas de entrada");
    } else {
      fwText = (fw.profiles || []).filter(function (p) { return p.active; }).map(function (p) {
        return "perfil " + p.name + (p.enabled ? (p.block_inbound ? ": activo" : ": permite la entrada") : ": desactivado");
      }).join(" · ");
    }
    meta.appendChild(el("span", null, [el("b", { text: "Firewall" }), fwText + " · " + fw.inbound_rules + " reglas de entrada"]));
  }
  app.appendChild(el("div", { class: "host" }, [el("h1", { text: host.hostname || "Equipo" }), meta]));
  (data.notes || []).forEach(function (n) {
    app.appendChild(el("div", { class: "warn-banner" }, [el("span", { class: "ico", text: "⚠" }), el("span", { text: n })]));
  });

  // ---- Puntuación y cifras
  var c = scoreColor(data.score);
  var hero = el("div", { class: "card hero" }, [
    el("h2", { text: "Exposición" }),
    el("div", { class: "hero-figure" }, [el("span", { class: "num", text: String(data.score) }), el("span", { class: "of", text: "/ 100" }),
      el("span", { class: "grade", text: data.grade, style: "color:" + c })]),
    el("div", { class: "meter" }, [el("i", { style: "width:" + data.score + "%;background:" + c })]),
    el("p", { text: scoreWord(data.score) + ". Cada hallazgo resta según su severidad (crítico 30, alto 15, medio 7, bajo 3)." })
  ]);
  function kpi(label, value, sub, color) {
    return el("div", { class: "card kpi" }, [el("div", { class: "label" }, [dot(color), label]), el("div", { class: "value", text: String(value) }), el("div", { class: "sub", text: sub })]);
  }
  var open = fw ? data.reachable - (data.limited || 0) : data.exposed;
  var kpis = el("div", { class: "kpis" }, [
    kpi("En la red", data.exposed, "servicios que escuchan fuera del equipo", "var(--accent)"),
    kpi("Abiertos a cualquiera", open, fw ? "el firewall no los limita" : "firewall sin evaluar", "var(--critical)"),
    kpi("Limitados", fw ? (data.limited || 0) : "—", "solo desde ciertas redes", "var(--serious)"),
    kpi("Filtrados", fw ? data.exposed - data.reachable : "—", "los bloquea el firewall", "var(--good)")
  ]);
  app.appendChild(el("div", { class: "hero-row" }, [hero, kpis]));

  // ---- Cambios desde el último análisis guardado
  var ch = data.changes;
  if (ch) {
    var since = fmtDate(ch.since);
    var KIND = {
      worse: { sym: "↑", color: "var(--critical)" }, "new": { sym: "+", color: "var(--critical)" },
      finding: { sym: "!", color: "var(--critical)", pre: "Hallazgo nuevo: " },
      better: { sym: "↓", color: "var(--good-text)" }, gone: { sym: "−", color: "var(--good-text)" },
      resolved: { sym: "✓", color: "var(--good-text)", pre: "Resuelto: " }
    };
    var items = ch.items || [];
    var body = items.length ? el("ul", { class: "list" }, items.map(function (c) {
      var k = KIND[c.kind] || { sym: "·", color: "var(--muted)" };
      return el("li", null, [el("b", { text: k.sym + " ", style: "color:" + k.color }), (k.pre || "") + c.title]);
    })) : el("p", { class: "empty", text: "Sin cambios en la exposición." });
    var title = "Cambios desde el " + since + (ch.score_before !== data.score ? " · exposición " + ch.score_before + " → " + data.score : "");
    app.appendChild(card(title, [body]));
  }

  // ---- Hallazgos
  var flist = el("div");
  if (!findings.length) flist.appendChild(el("p", { class: "empty", text: "Sin hallazgos: nada de riesgo expuesto a la red." }));
  findings.forEach(function (f) {
    var s = SEV[f.severity] || SEV.info;
    var item = el("div", { class: "finding" }, [
      badge(s.color, s.label),
      el("div", null, [el("span", { class: "t", text: f.title }), el("span", { class: "s", text: f.subject })]),
      f.detail ? el("p", { class: "d", text: f.detail }) : null,
      f.fix ? el("p", { class: "fix", text: "→ " + f.fix }) : null
    ]);
    if (f.firewall_rules && f.firewall_rules.length) {
      var cmd = "bastion surface fix " + f.id + (/^SURF-PORT-(22|3389|5985|5986|5900)$/.test(f.id) ? " --include-remote" : "") + " --apply";
      var copy = el("button", { class: "btn copy", type: "button", text: "Copiar" });
      copy.addEventListener("click", function () {
        if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(function () { copy.textContent = "Copiado"; setTimeout(function () { copy.textContent = "Copiar"; }, 1500); });
      });
      item.appendChild(el("pre", null, [el("code", { text: cmd }), copy]));
    }
    flist.appendChild(item);
  });
  app.appendChild(card("Hallazgos (" + findings.length + ")", [flist]));

  // ---- Puertos
  var heads = ["Puerto", "Dirección"].concat(fw ? ["Firewall"] : [], ["Proceso", "Servicio"]);
  var tbl = el("table", { class: "ptable" }, [el("thead", null, [el("tr", null, heads.map(function (h) { return el("th", { text: h }); }))])]);
  var tb = el("tbody");
  // De dónde viene el ejecutable: firma (Windows) o paquete (Linux).
  function origin(p) {
    var t = { valid: "firmado por " + (p.signer || "?"), unsigned: "sin firma digital", invalid: "firma no válida",
      untrusted: "certificado sin confianza" + (p.signer ? ": " + p.signer : ""), package: "paquete " + (p.signer || "?"),
      unpackaged: "fuera de los paquetes", modified: "modificado respecto al paquete " + (p.signer || "?") }[p.signature];
    if (!t) return null;
    var color = (p.signature === "invalid" || p.signature === "modified") ? "var(--critical)" : (p.signature === "unsigned" || p.signature === "untrusted" || p.signature === "unpackaged") ? "var(--serious)" : "";
    return el("div", { class: "sub", text: t, title: p.path || "", style: color ? "color:" + color + ";font-weight:600" : "" });
  }
  ports.forEach(function (p) {
    var cells = [el("td", { class: "port", text: p.port + "/" + p.proto }), el("td", { text: (p.addresses || []).join(", ") })];
    if (fw) {
      var st = p.firewall === "open" ? el("span", { class: "fw-open", text: "abierto" }) :
        p.firewall === "limited" ? el("span", { class: "fw-limited", text: "limitado: " + (p.firewall_limit || "") }) :
        p.firewall === "filtered" ? el("span", { class: "fw-filtered", text: "filtrado" }) : el("span", { class: "sub", text: "—" });
      cells.push(el("td", null, [st, p.firewall_why ? el("div", { class: "sub", text: p.firewall_why }) : null]));
    }
    var proc = (p.process || "?") + (p.pid ? " (" + p.pid + ")" : "");
    cells.push(el("td", null, [proc, p.services && p.services.length ? el("div", { class: "sub", text: p.services.join(", ") }) : null, origin(p)]));
    cells.push(el("td", { text: p.known || "" }));
    tb.appendChild(el("tr", null, cells));
  });
  tbl.appendChild(tb);
  app.appendChild(card("Servicios en la red (" + ports.length + ")",
    [ports.length ? el("div", { class: "table-wrap" }, [tbl]) : el("p", { class: "empty", text: "Ningún servicio escucha en la red." })]));

  // ---- Recursos compartidos y administradores
  var shares = data.shares || [];
  var shareList = shares.length ? el("ul", { class: "list" }, shares.map(function (s) {
    var acc = (s.access || []).map(function (a) { return (a.deny ? "deniega " : "") + a.account + " (" + a.right + ")"; }).join(", ");
    return el("li", null, [el("b", { text: s.name }), " · " + s.kind + (s.path ? " · " + s.path : ""), acc ? el("div", { class: "sub", text: acc }) : null,
      s.options && s.options.length ? el("div", { class: "sub", text: s.options.join(", ") }) : null]);
  })) : el("p", { class: "empty", text: "Ningún recurso compartido." });
  var admins = data.admins || [];
  var adminList = admins.length ? el("ul", { class: "list" }, admins.map(function (a) {
    return el("li", null, [el("b", { text: a.name }), el("div", { class: "sub", text: [a.kind, a.source].filter(Boolean).join(" · ") })]);
  })) : el("p", { class: "empty", text: "No se pudieron leer los administradores." });
  app.appendChild(el("section", { class: "two" }, [card("Recursos compartidos (" + shares.length + ")", [shareList]), card("Administradores (" + admins.length + ")", [adminList])]));

  app.appendChild(el("footer", { text: "Generado por Bastion " + (data.version || "") + " el " + fmtDate(data.finished_at) +
    ". Solo lectura: el análisis no ha cambiado nada en el equipo." }));

  try { var saved = localStorage.getItem("bastion-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  document.getElementById("theme").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("bastion-theme", next); } catch (e) {}
  });
  document.getElementById("print").addEventListener("click", function () { window.print(); });
})();
</script>
</body>
</html>
