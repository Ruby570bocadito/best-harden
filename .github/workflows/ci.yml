name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Formato
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Tests con detector de carreras
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Validar reglas
        run: go run ./cmd/adarve rules lint
      - name: Compilar
        run: go build -o bin/ ./cmd/adarve
      # Escaneo real en el runner: prueba todos los probes contra un
      # Ubuntu y un Windows Server reales.
      - name: Escaneo real (Linux)
        if: runner.os == 'Linux'
        run: sudo ./bin/adarve scan --all -o report.html -o report.json
      - name: Escaneo real (Windows)
        if: runner.os == 'Windows'
        run: .\bin\adarve.exe scan --all -o report.html -o report.json
      # Superficie de ataque en un sistema real (en Windows ejercita netstat,
      # tasklist y las consultas PowerShell de recursos y administradores).
      - name: Superficie de ataque (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo ./bin/adarve surface --all --no-color
          sudo ./bin/adarve surface --format json | jq -e '.schema == "adarve.surface/v1" and (.listeners | length) > 0 and (.ports | length) > 0 and (.admins | length) > 0 and (.firewall.source | test("tables"))'
      # Reglas de ufw reales (iptables-nft) en un espacio de red aislado, con
      # servicios escuchando: SSH abierto, MySQL solo desde la LAN y Tailscale,
      # 8080 solo por Tailscale.
      - name: Firewall de Linux (ufw en un espacio de red aislado)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo unshare -n sh -c '
            iptables-nft-restore < internal/surface/testdata/ufw.rules
            for p in 22 3306 8080; do python3 -m http.server $p --bind 0.0.0.0 >/dev/null 2>&1 & done
            sleep 2
            ./bin/adarve surface --format json > fw.json
            kill $(jobs -p)'
          jq -r '.ports[] | select(.scope == "network") | "\(.port)/\(.proto) \(.firewall) \(.firewall_limit // "") · \(.firewall_why)"' fw.json
          jq -e '.firewall.source == "iptables" and .firewall.input_policy == "drop"
            and ([.ports[] | select(.port == 22)][0].firewall == "open")
            and ([.ports[] | select(.port == 3306)][0].firewall_limit == "Tailscale y 192.168.1.0/24")
            and ([.ports[] | select(.port == 8080)][0].firewall_limit == "Tailscale")
            and ([.ports[] | select(.port == 22)][0].signature == "package")' fw.json
      # Análisis programado de verdad: temporizador de systemd en el runner,
      # ejecución inmediata del servicio, registro de la ejecución y avisos
      # (journald y un webhook local que guarda el primer POST que recibe).
      - name: Análisis programado (Linux, systemd)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          hook() {
            rm -f hook.json
            python3 -c '
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  open("hook.json", "wb").write(self.rfile.read(int(self.headers["Content-Length"])))
                  self.send_response(204); self.end_headers()
          s = http.server.HTTPServer(("127.0.0.1", 8099), H); s.timeout = 120; s.handle_request()' &
            HOOK=$!
            sleep 1
          }
          sudo ./bin/adarve schedule enable --at 03:00 --unsafe-path --no-color
          systemctl list-timers adarve-scan.timer --all --no-pager
          hook
          sudo ./bin/adarve schedule notify --set http://127.0.0.1:8099/hook --format json --when always --no-color
          wait $HOOK
          jq -e '.schema == "adarve.notify/v1" and .test == true' hook.json
          hook
          sudo systemctl start adarve-scan.service
          wait $HOOK
          jq -e '.schema == "adarve.notify/v1" and (.test | not) and .scan_score > 0 and (.level | IN("info", "warning"))' hook.json
          sudo ./bin/adarve schedule --no-color
          sudo tail -n 1 /var/lib/adarve/schedule.log | jq -e '.scan_score > 0 and .surface_score > 0 and (.errors | not) and (.notify_errors | not)'
          journalctl -t adarve --since '-15min' --no-pager | tail -n 3
          journalctl -t adarve --since '-15min' --no-pager | grep -q 'Adarve ·'
          sudo ./bin/adarve schedule notify --clear --no-color
          sudo ./bin/adarve schedule disable --no-color
          test ! -e /etc/systemd/system/adarve-scan.timer
      - name: Superficie de ataque (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\bin\adarve.exe surface --all --no-color
          if ($LASTEXITCODE -ne 0) { throw 'surface falló' }
          $r = .\bin\adarve.exe surface --format json | ConvertFrom-Json
          if ($r.listeners.Count -eq 0) { throw 'no se detectó ningún puerto a la escucha' }
          if ($r.admins.Count -eq 0) { throw 'no se leyeron los administradores' }
          if (-not ($r.listeners | Where-Object { $_.process })) { throw 'ningún puerto asociado a su proceso' }
          if (-not $r.firewall -or $r.firewall.profiles.Count -ne 3) { throw 'no se evaluó el Firewall de Windows' }
          $r.ports | Where-Object { $_.scope -eq 'network' } | Select-Object port, proto, process, signature, signer | Format-Table | Out-String | Write-Host
          if (-not ($r.ports | Where-Object { $_.signature -eq 'valid' -and $_.signer -match 'Microsoft' })) { throw 'no se comprobó la firma de los programas que escuchan en la red' }
          # Como administrador, las reglas salen completas del registro.
          if ($r.firewall.source -ne 'registry' -or $r.firewall.inbound_rules -eq 0) { throw "reglas del firewall no leídas del registro (origen: $($r.firewall.source))" }
          "Servicios en la red: $($r.exposed) · accesibles a través del firewall: $($r.reachable) · reglas de entrada: $($r.firewall.inbound_rules) ($($r.firewall.source))"
      # Una excepción saca el control de la puntuación y al quitarla vuelve.
      - name: Excepciones (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          b=./bin/adarve
          id=$(sudo $b scan --format json | jq -r '[.results[] | select(.status=="fail")][0].rule.id')
          sudo $b exceptions add "$id" --reason "Prueba de CI: riesgo aceptado temporalmente" --expires 7d --no-color
          sudo $b exceptions list --no-color
          test "$(sudo $b scan --format json | jq '.score.exceptions')" -eq 1
          sudo $b exceptions remove "$id" --no-color
          test "$(sudo $b scan --format json | jq '.score.exceptions')" -eq 0
      # Consola local: sin token no hay datos, Host ajeno rechazado, y con
      # token escanea y calcula el plan.
      - name: Consola local (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo ./bin/adarve ui --no-open --port 8790 --no-color > ui.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do grep -q '?t=' ui.log && break; sleep 0.5; done
          tok=$(grep -o '?t=[A-Za-z0-9_-]*' ui.log | head -1 | cut -c4-)
          base=http://127.0.0.1:8790
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' $base/)" = 403
          curl -sf -H "X-Adarve-Token: $tok" $base/api/state | jq -e '.hostname'
          curl -sf -X POST -H "X-Adarve-Token: $tok" $base/api/scan | jq -e '.report.score.value >= 0'
          curl -sf -H "X-Adarve-Token: $tok" "$base/api/plan?wave=1" | jq -e 'length > 0'
          curl -sf -H "X-Adarve-Token: $tok" $base/api/reports | jq -e 'length >= 1'
          # Navegador: la dirección de la terminal abre una sesión con cookie
          # HttpOnly y redirige sin el token; la cookie sola no basta para la
          # API (hace falta X-Adarve-Request) y el informe ya no acepta ?t=.
          id=$(curl -sf -H "X-Adarve-Token: $tok" $base/api/reports | jq -r '.[-1].id')
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/r/$id.html?t=$tok")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -c jar.txt "$base/?t=$tok")" = "303 $base/"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $base/api/state)" = 401
          curl -sf -b jar.txt -H 'X-Adarve-Request: 1' $base/api/state | jq -e '.hostname'
          curl -sf -b jar.txt "$base/r/$id.html" | grep -q 'adarve-data'
          sudo kill "$pid" || true
      # Ciclo completo de hardening en la máquina desechable del runner:
      # aplicar la ola 1 debe mejorar la postura y el rollback debe dejarla
      # exactamente como estaba.
      - name: Ciclo harden → rollback (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          b=./bin/adarve
          before=$(sudo $b scan --format json | jq .score.value)
          sudo $b harden --wave 1 --no-color
          sudo $b harden --wave 1 --apply --yes --no-color
          after=$(sudo $b scan --format json | jq .score.value)
          sudo $b history --no-color
          sudo $b rollback --yes --no-color
          restored=$(sudo $b scan --format json | jq .score.value)
          echo "Postura: $before → $after → $restored"
          test "$after" -gt "$before"
          test "$restored" -eq "$before"
      - name: Ciclo harden → rollback (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b = '.\bin\adarve.exe'
          $before = (& $b scan --format json | ConvertFrom-Json).score.value
          & $b harden --wave 1 --no-color
          & $b harden --wave 1 --apply --yes --no-color
          if ($LASTEXITCODE -ne 0) { throw 'harden falló' }
          $after = (& $b scan --format json | ConvertFrom-Json).score.value
          & $b history --no-color
          & $b rollback --yes --no-color
          if ($LASTEXITCODE -ne 0) { throw 'rollback falló' }
          $restored = (& $b scan --format json | ConvertFrom-Json).score.value
          "Postura: $before -> $after -> $restored"
          if ($after -le $before) { throw 'harden no mejoró la postura' }
          if ($restored -ne $before) { throw "rollback no restauró la postura ($restored distinto de $before)" }
      # Análisis programado de verdad: tarea del Programador de tareas como
      # SYSTEM, ejecutada al momento, con su registro.
      - name: Análisis programado (Windows, Programador de tareas)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b = (Resolve-Path '.\bin\adarve.exe').Path
          # Webhook local: un trabajo que devuelve el primer POST que recibe.
          function Start-Hook {
            $j = Start-Job {
              $l = [System.Net.HttpListener]::new(); $l.Prefixes.Add('http://127.0.0.1:8099/'); $l.Start()
              $c = $l.GetContext(); $body = [IO.StreamReader]::new($c.Request.InputStream).ReadToEnd()
              $c.Response.StatusCode = 204; $c.Response.Close(); $l.Stop(); $body
            }
            Start-Sleep -Seconds 3
            $j
          }
          function Receive-Hook($j) {
            if (-not (Wait-Job $j -Timeout 120)) { throw 'el webhook local no recibió ningún aviso' }
            Receive-Job $j | ConvertFrom-Json
          }
          & $b schedule enable --at 03:00 --unsafe-path --no-color
          if ($LASTEXITCODE -ne 0) { throw 'schedule enable falló' }
          $hook = Start-Hook
          & $b schedule notify --set http://127.0.0.1:8099/hook --format json --when always --no-color
          if ($LASTEXITCODE -ne 0) { throw 'schedule notify falló' }
          $n = Receive-Hook $hook
          if ($n.schema -ne 'adarve.notify/v1' -or -not $n.test) { throw "aviso de prueba inesperado: $($n | ConvertTo-Json -Compress)" }
          $hook = Start-Hook
          $tp = '\Adarve\'; $tn = 'Escaneo diario'
          (Get-ScheduledTask -TaskPath $tp -TaskName $tn).Principal | Format-List UserId, LogonType, RunLevel | Out-String | Write-Host
          $before = (Get-ScheduledTaskInfo -TaskPath $tp -TaskName $tn).LastRunTime
          Start-ScheduledTask -TaskPath $tp -TaskName $tn
          $deadline = (Get-Date).AddMinutes(8)
          do {
            Start-Sleep -Seconds 5
            $i = Get-ScheduledTaskInfo -TaskPath $tp -TaskName $tn
            $state = (Get-ScheduledTask -TaskPath $tp -TaskName $tn).State
          } while (($state -eq 'Running' -or $i.LastRunTime -eq $before) -and (Get-Date) -lt $deadline)
          "Estado: $state · última ejecución: $($i.LastRunTime) · resultado: $($i.LastTaskResult)"
          if ($i.LastTaskResult -ne 0 -and $i.LastTaskResult -ne 3) { throw "la tarea terminó con el código $($i.LastTaskResult)" }
          & $b schedule --no-color
          $last = Get-Content (Join-Path $env:ProgramData 'Adarve\schedule.log') | Select-Object -Last 1 | ConvertFrom-Json
          if ($last.scan_score -le 0 -or $last.errors -or $last.notify_errors) { throw "ejecución con errores: $($last | ConvertTo-Json -Compress)" }
          # El aviso de la tarea (como SYSTEM) llega al webhook y al Visor de eventos.
          $n = Receive-Hook $hook
          if ($n.test -or $n.scan_score -le 0 -or $n.level -notin 'info', 'warning') { throw "aviso de la tarea inesperado: $($n | ConvertTo-Json -Compress)" }
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Adarve' } -MaxEvents 1
          "Evento $($ev.Id): $($ev.Message)"
          if ($ev.Id -notin 100, 200 -or $ev.Message -notmatch 'Adarve ·') { throw 'el aviso no está en el Visor de eventos' }
          & $b schedule notify --clear --no-color
          & $b schedule disable --no-color
          if (Get-ScheduledTask -TaskPath $tp -TaskName $tn -ErrorAction SilentlyContinue) { throw 'la tarea sigue existiendo' }
      # adarve surface fix de verdad: una regla que abre un puerto a
      # cualquiera, con un programa escuchando detrás; se limita a la red
      # local y el rollback la deja como estaba.
      - name: Ciclo surface fix → rollback (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b = '.\bin\adarve.exe'
          $profiles = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction
          $profiles | Format-Table | Out-String | Write-Host
          New-NetFirewallRule -Name 'Adarve-CI-Test' -DisplayName 'Adarve CI' -Direction Inbound -Protocol TCP -LocalPort 48765 -Action Allow | Out-Null
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 48765)
          $listener.Start()
          try {
            # La evaluación necesita el firewall activo y bloqueando la entrada.
            Set-NetFirewallProfile -All -Enabled True -DefaultInboundAction Block
            $r = & $b surface --format json | ConvertFrom-Json
            $f = $r.findings | Where-Object { $_.id -eq 'SURF-APPS-OPEN' }
            if (-not $f -or $f.firewall_rules -notcontains 'Adarve-CI-Test') { throw "la regla de prueba no aparece en SURF-APPS-OPEN: $($r.findings | ConvertTo-Json -Depth 4)" }
            & $b surface fix SURF-APPS-OPEN --no-color
            & $b surface fix SURF-APPS-OPEN --apply --yes --no-color
            if ($LASTEXITCODE -ne 0) { throw 'surface fix falló' }
            $after = (Get-NetFirewallRule -Name 'Adarve-CI-Test' | Get-NetFirewallAddressFilter).RemoteAddress
            if ($after -ne 'LocalSubnet') { throw "la regla no quedó limitada: $after" }
            & $b history --no-color
            & $b rollback --yes --no-color
            if ($LASTEXITCODE -ne 0) { throw 'rollback falló' }
            $restored = (Get-NetFirewallRule -Name 'Adarve-CI-Test' | Get-NetFirewallAddressFilter).RemoteAddress
            "RemoteAddress: Any -> $after -> $restored"
            if ($restored -ne 'Any') { throw "rollback no restauró la regla: $restored" }
          } finally {
            $listener.Stop()
            Remove-NetFirewallRule -Name 'Adarve-CI-Test' -ErrorAction SilentlyContinue
            foreach ($p in $profiles) { Set-NetFirewallProfile -Name $p.Name -Enabled $p.Enabled -DefaultInboundAction $p.DefaultInboundAction }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: informe-${{ matrix.os }}
          path: report.*

  scripts:
    name: Instaladores
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $r = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck scripts/install.sh

  cross:
    name: Compilación cruzada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/adarve
            echo "ok $target"
          done
