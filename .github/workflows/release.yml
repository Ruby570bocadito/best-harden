name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # firmar la procedencia con la identidad OIDC del workflow (Sigstore)
  attestations: write  # publicar las atestaciones en el repositorio

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: version.txt para los instaladores
        run: mkdir -p .release && echo "${GITHUB_REF_NAME}" > .release/version.txt
      - name: Instalar Syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Procedencia SLSA de cada archivo publicado: prueba que lo construyó
      # este workflow a partir de esta etiqueta del repositorio. Se comprueba
      # con «gh attestation verify <archivo> --repo Ruby570bocadito/bastion».
      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
