name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # firmar la procedencia con la identidad OIDC del workflow (Sigstore)
  attestations: write  # publicar las atestaciones en el repositorio

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: version.txt para los instaladores
        run: mkdir -p .release && echo "${GITHUB_REF_NAME}" > .release/version.txt
      - name: Instalar Syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # La clave privada solo existe en el secreto ADARVE_SIGNING_KEY y en un
      # fichero temporal del runner durante este job.
      - name: Clave de firma de las releases
        env:
          KEY: ${{ secrets.ADARVE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Falta el secreto ADARVE_SIGNING_KEY: sin él la release no se puede firmar"; exit 1; fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.key"
          echo "ADARVE_SIGNING_KEY_FILE=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"
          # Debe ser la pareja de la clave pública que llevan el binario y los
          # instaladores: si no, ningún cliente aceptaría la release.
          openssl ec -in "$RUNNER_TEMP/signing.key" -pubout 2>/dev/null | diff - internal/selfupdate/release-signing.pub \
            || { echo "::error::ADARVE_SIGNING_KEY no corresponde a internal/selfupdate/release-signing.pub"; exit 1; }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprobar la firma publicada
        run: openssl dgst -sha256 -verify internal/selfupdate/release-signing.pub -signature dist/checksums.txt.sig dist/checksums.txt
      - name: Borrar la clave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.key"
      # Procedencia SLSA de cada archivo publicado: prueba que lo construyó
      # este workflow a partir de esta etiqueta del repositorio. Se comprueba
      # con «gh attestation verify <archivo> --repo Ruby570bocadito/adarve».
      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
