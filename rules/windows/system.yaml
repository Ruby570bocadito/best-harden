# Sistema: UAC, arranque seguro, AutoRun, cifrado y servicios.
id: WIN-SYS-001
title: Control de cuentas de usuario (UAC) activado
description: EnableLUA debe ser 1.
rationale: Sin UAC todos los procesos de un administrador se ejecutan con privilegios completos.
category: Sistema
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-6]
  mitre_mitigations: [M1052]
  mitre_techniques: [T1548.002]
check:
  probe: registry
  path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
  name: EnableLUA
  op: eq
  expected: 1
  default: 1
remediation:
  summary: Habilitar "User Account Control - Run all administrators in Admin Approval Mode".
  breaking_risk: low
  reboot_required: true
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      name: 'EnableLUA'
      value: 1
---
id: WIN-SYS-002
title: UAC pide consentimiento a los administradores
description: ConsentPromptBehaviorAdmin debe ser 1 (credenciales) o 2 (consentimiento en escritorio seguro).
rationale: Con el valor por defecto (5) algunas elevaciones se aprueban automáticamente y permiten bypass de UAC.
category: Sistema
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-6]
  mitre_mitigations: [M1052]
  mitre_techniques: [T1548.002]
check:
  probe: registry
  path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
  name: ConsentPromptBehaviorAdmin
  op: in
  expected: [1, 2]
  default: 5
remediation:
  summary: Fijar "Behavior of the elevation prompt for administrators" en "Prompt for consent on the secure desktop".
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      name: 'ConsentPromptBehaviorAdmin'
      value: 2
---
id: WIN-SYS-003
title: Arranque seguro (Secure Boot) activado
description: UEFI Secure Boot debe estar activado.
rationale: Impide cargar bootkits y cargadores de arranque no firmados.
category: Sistema
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SI-7]
  mitre_mitigations: [M1046]
  mitre_techniques: [T1542.003]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State
  name: UEFISecureBootEnabled
  op: eq
  expected: 1
remediation:
  summary: Activar Secure Boot en el firmware UEFI (requiere disco GPT y arranque UEFI).
  breaking_risk: medium
  reboot_required: true
impact: Los equipos con arranque BIOS heredado necesitan convertir el disco a GPT (mbr2gpt) antes.
---
id: WIN-SYS-004
title: AutoRun y AutoPlay deshabilitados
description: AutoRun debe estar deshabilitado para todas las unidades.
rationale: Evita la ejecución automática de malware desde unidades extraíbles.
category: Sistema
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [CM-7, MP-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1091]
check:
  all:
    - {label: NoDriveTypeAutoRun, probe: registry, path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer, name: NoDriveTypeAutoRun, op: eq, expected: 255, default: 145}
    - {label: NoAutorun, probe: registry, path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer, name: NoAutorun, op: eq, expected: 1, default: 0}
remediation:
  summary: Habilitar "Turn off Autoplay" (todas las unidades) y "Set the default behavior for AutoRun" (no ejecutar).
  gpo: Computer Configuration > Administrative Templates > Windows Components > AutoPlay Policies
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      name: 'NoDriveTypeAutoRun'
      value: 255
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      name: 'NoAutorun'
      value: 1
---
id: WIN-SYS-005
title: Integridad de memoria (HVCI) en ejecución
description: La integridad de código protegida por hipervisor debe estar en ejecución.
rationale: Impide cargar controladores no firmados o vulnerables en el kernel.
category: Sistema
severity: medium
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [SI-7]
  mitre_mitigations: [M1050]
  mitre_techniques: [T1068, T1014]
check:
  probe: ps
  query: device_guard
  field: SecurityServicesRunning
  op: contains
  expected: 2
remediation:
  summary: Activar la integridad de memoria (Memory Integrity) por GPO, Intune o Seguridad de Windows.
  breaking_risk: medium
  reboot_required: true
impact: Controladores antiguos incompatibles impedirán activarlo o dejarán de cargarse.
---
id: WIN-ENC-001
title: BitLocker protege la unidad del sistema
description: La unidad del sistema debe estar cifrada con BitLocker y la protección activa.
rationale: Protege los datos y las credenciales en caché si el equipo se pierde o es robado.
category: Cifrado
severity: high
platforms: [windows-client]
profiles: [win-workstation-l1]
references:
  nist: [SC-28, MP-5]
  mitre_mitigations: [M1041]
  mitre_techniques: [T1005, T1003]
check:
  probe: ps
  query: bitlocker_os
  field: ProtectionStatus
  op: eq
  expected: "On"
remediation:
  summary: Activar BitLocker con TPM (y PIN en equipos de alto riesgo) y custodiar la clave de recuperación en AD o Entra ID.
  commands: Enable-BitLocker -MountPoint $env:SystemDrive -TpmProtector -EncryptionMethod XtsAes256
  breaking_risk: low
---
id: WIN-ENC-002
title: TLS 1.0 y 1.1 deshabilitados en el servidor
description: SChannel no debe aceptar TLS 1.0 ni TLS 1.1 como servidor.
rationale: TLS 1.0/1.1 están obsoletos (RFC 8996) y tienen debilidades criptográficas conocidas.
category: Cifrado
severity: medium
platforms: [windows]
profiles: [win-workstation-l2, win-server-l1]
references:
  nist: [SC-8, SC-13]
  mitre_techniques: [T1040, T1557]
check:
  all:
    - {label: TLS 1.0, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server, name: Enabled, op: eq, expected: 0, default: 1}
    - {label: TLS 1.1, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server, name: Enabled, op: eq, expected: 0, default: 1}
remediation:
  summary: Deshabilitar TLS 1.0/1.1 en SChannel (servidor) y reiniciar.
  breaking_risk: medium
  reboot_required: true
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server'
      name: 'Enabled'
      value: 0
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server'
      name: 'Enabled'
      value: 0
impact: Clientes antiguos (Windows 7 sin parches, Java antiguo, appliances) no podrán conectar a los servicios TLS del equipo.
---
id: WIN-SVC-001
title: Registro remoto deshabilitado
description: El servicio RemoteRegistry debe estar deshabilitado.
rationale: Permite leer y modificar el registro por red, útil para reconocimiento y persistencia.
category: Servicios
severity: medium
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1012, T1112]
check:
  probe: service
  name: RemoteRegistry
  field: start_type
  op: eq
  expected: disabled
  on_missing: pass
remediation:
  summary: Deshabilitar el servicio.
  commands: Set-Service RemoteRegistry -StartupType Disabled; Stop-Service RemoteRegistry
  breaking_risk: low
  actions:
    - type: service.config
      name: RemoteRegistry
      start_type: disabled
      stop: true
impact: Algunas herramientas de inventario y monitorización usan el registro remoto.
---
id: WIN-SYS-006
title: Windows Installer no instala siempre con privilegios elevados
description: La directiva AlwaysInstallElevated debe estar deshabilitada.
rationale: Con AlwaysInstallElevated activo, cualquier usuario puede instalar un paquete .msi como SYSTEM. Es una de las escaladas de privilegios más conocidas y la buscan todas las herramientas de post-explotación.
category: Sistema
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-6, CM-11]
  mitre_mitigations: [M1047, M1026]
  mitre_techniques: [T1548]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer
  name: AlwaysInstallElevated
  op: eq
  expected: 0
  default: 0
remediation:
  summary: Deshabilitar "Always install with elevated privileges".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Windows Installer > Always install with elevated privileges
  commands: reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer" /v AlwaysInstallElevated /t REG_DWORD /d 0 /f
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer'
      name: 'AlwaysInstallElevated'
      value: 0
---
id: WIN-SYS-007
title: SmartScreen de Windows activado
description: SmartScreen debe avisar antes de ejecutar programas descargados poco conocidos.
rationale: SmartScreen bloquea o avisa ante ejecutables y sitios con mala reputación, una barrera eficaz contra el malware que llega por descargas y correo.
category: Sistema
severity: medium
platforms: [windows-client]
profiles: [win-workstation-l1]
references:
  nist: [SI-3, SI-8]
  mitre_mitigations: [M1038, M1017]
  mitre_techniques: [T1204.002]
check:
  any:
    - {label: directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows\System, name: EnableSmartScreen, op: eq, expected: 1}
    - all:
        - {label: sin directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows\System, name: EnableSmartScreen, op: absent}
        - {label: local, probe: registry, path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer, name: SmartScreenEnabled, op: ne, expected: "Off", default: Warn}
remediation:
  summary: Habilitar "Configure Windows Defender SmartScreen" (avisar).
  gpo: Computer Configuration > Administrative Templates > Windows Components > File Explorer > Configure Windows Defender SmartScreen
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
      name: 'EnableSmartScreen'
      value: 1
impact: Los programas descargados sin reputación muestran un aviso que el usuario puede saltarse. Para impedir saltárselo (CIS), añade ShellSmartScreenLevel = Block.
---
id: WIN-SYS-008
title: Bloqueo de la sesión tras 15 minutos de inactividad
description: El equipo debe bloquear la sesión tras 900 segundos o menos sin actividad.
rationale: Una sesión abierta y desatendida da a cualquiera con acceso físico (o a una sesión remota secuestrada) los permisos del usuario.
category: Sistema
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-11, AC-12]
  mitre_techniques: [T1078]
check:
  probe: registry
  path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
  name: InactivityTimeoutSecs
  op: between
  expected: [1, 900]
remediation:
  summary: Fijar "Interactive logon - Machine inactivity limit" en 900 segundos o menos.
  gpo: Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon - Machine inactivity limit
  commands: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v InactivityTimeoutSecs /t REG_DWORD /d 900 /f
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      name: 'InactivityTimeoutSecs'
      value: 900
impact: La sesión se bloquea tras 15 minutos sin teclado ni ratón (no se cierra ni se pierde nada).
---
id: WIN-SYS-009
title: Protección SEHOP activada
description: La validación de la cadena de excepciones (SEHOP) debe estar activada para todo el sistema.
rationale: SEHOP bloquea una técnica clásica de explotación de desbordamientos de pila que sobrescribe los manejadores de excepciones.
category: Sistema
severity: low
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SI-16]
  mitre_mitigations: [M1050]
  mitre_techniques: [T1203]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel
  name: DisableExceptionChainValidation
  op: eq
  expected: 0
  default: 0
remediation:
  summary: Activar SEHOP (DisableExceptionChainValidation = 0).
  gpo: Computer Configuration > Administrative Templates > MS Security Guide > Enable Structured Exception Handling Overwrite Protection (SEHOP)
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
      name: 'DisableExceptionChainValidation'
      value: 0
  reboot_required: true
---
id: WIN-SYS-010
title: Descarga de controladores de impresora por HTTP deshabilitada
description: Windows no debe descargar controladores de impresora por HTTP.
rationale: Los controladores se instalan con privilegios de SYSTEM; descargarlos sin cifrar permite que alguien en la red los sustituya.
category: Sistema
severity: low
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [CM-7, SC-8]
  mitre_techniques: [T1557]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers
  name: DisableWebPnPDownload
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Turn off downloading of print drivers over HTTP".
  gpo: Computer Configuration > Administrative Templates > System > Internet Communication Management > Internet Communication settings
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      name: 'DisableWebPnPDownload'
      value: 1
---
id: WIN-UPD-001
title: Actualizaciones automáticas de Windows no desactivadas por directiva
description: Ninguna directiva debe desactivar las actualizaciones automáticas de Windows (NoAutoUpdate).
rationale: La mayoría de las intrusiones aprovechan vulnerabilidades con parche publicado. Un equipo sin actualizaciones acumula fallos explotables cada mes.
category: Sistema
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SI-2]
  mitre_mitigations: [M1051]
  mitre_techniques: [T1190, T1203]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
  name: NoAutoUpdate
  op: eq
  expected: 0
  default: 0
remediation:
  summary: Quitar la directiva que desactiva las actualizaciones automáticas.
  gpo: Computer Configuration > Administrative Templates > Windows Components > Windows Update > Configure Automatic Updates
  commands: |
    reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v NoAutoUpdate /t REG_DWORD /d 0 /f
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      name: 'NoAutoUpdate'
      value: 0
---
# Separada de WIN-UPD-001: su acción automática no puede corregir el
# servicio, así que juntas la remediación nunca hacía pasar el control.
id: WIN-UPD-002
title: Servicio Windows Update no deshabilitado
description: El servicio Windows Update (wuauserv) no debe estar deshabilitado.
rationale: Con el servicio deshabilitado no se instala ningún parche, aunque ninguna directiva lo impida.
category: Sistema
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SI-2]
  mitre_mitigations: [M1051]
  mitre_techniques: [T1190, T1203]
check:
  probe: service
  name: wuauserv
  field: start_type
  op: ne
  expected: disabled
remediation:
  summary: Volver a poner el servicio Windows Update con inicio manual.
  commands: |
    Set-Service wuauserv -StartupType Manual
  breaking_risk: low
impact: Bastion no cambia el servicio automáticamente por si lo gestiona otra herramienta de parches (WSUS, Intune, un agente de terceros); compruébalo antes.