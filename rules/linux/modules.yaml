# Módulos del kernel que un servidor no necesita. Un módulo cumple si no
# existe en el sistema o si está bloqueado (install /bin/false + blacklist)
# y no está cargado.
id: LNX-MOD-001
title: "Módulo deshabilitado: Sistema de ficheros cramfs"
description: El módulo del kernel cramfs no debe poder cargarse.
rationale: Sistema de ficheros comprimido de solo lectura que un servidor no necesita.
category: Módulos del kernel
severity: low
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
check:
  any:
    - {label: no disponible, probe: kmod, name: cramfs, field: available, op: eq, expected: false}
    - all:
        - {label: no cargado, probe: kmod, name: cramfs, field: loaded, op: eq, expected: false}
        - {label: carga bloqueada, probe: kmod, name: cramfs, field: install_disabled, op: eq, expected: true}
        - {label: en blacklist, probe: kmod, name: cramfs, field: blacklisted, op: eq, expected: true}
remediation:
  summary: Bloquear la carga del módulo y descargarlo.
  commands: |
    printf 'install cramfs /bin/false\nblacklist cramfs\n' > /etc/modprobe.d/adarve-cramfs.conf
    modprobe -r cramfs 2>/dev/null || true
  breaking_risk: low
  actions:
    - type: kmod.block
      name: cramfs
