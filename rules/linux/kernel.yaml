id: LNX-KRN-013
title: Teclas SysRq deshabilitadas
description: kernel.sysrq debe valer 0.
rationale: Las combinaciones SysRq permiten, desde el teclado o /proc/sysrq-trigger, reiniciar, matar procesos o volcar memoria sin autenticarse.
category: Kernel
severity: low
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [AC-3, CM-7]
  mitre_techniques: [T1529]
check:
  probe: sysctl
  key: kernel.sysrq
  op: eq
  expected: 0
  on_missing: na
remediation:
  summary: Fijar kernel.sysrq = 0.
  commands: |
    echo 'kernel.sysrq = 0' > /etc/sysctl.d/60-adarve-sysrq.conf
    sysctl --system
  breaking_risk: low
  actions:
    - type: sysctl.set
      key: kernel.sysrq
      value: 0
      optional: true
impact: Sin SysRq no hay "reinicio de emergencia" desde el teclado si el sistema se cuelga.
