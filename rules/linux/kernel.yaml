# Parámetros de seguridad del kernel (sysctl en ejecución).
id: LNX-KRN-001
title: ASLR completo activado
description: La aleatorización del espacio de direcciones (ASLR) debe estar en modo completo (2).
rationale: ASLR dificulta la explotación de corrupciones de memoria al hacer impredecibles las direcciones de pila, heap y bibliotecas.
category: Kernel
severity: high
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SI-16]
  mitre_mitigations: [M1050]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: kernel.randomize_va_space
  op: eq
  expected: 2
remediation:
  summary: Fijar kernel.randomize_va_space = 2 de forma persistente.
  commands: |
    echo 'kernel.randomize_va_space = 2' > /etc/sysctl.d/60-adarve-aslr.conf
    sysctl -w kernel.randomize_va_space=2
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: kernel.randomize_va_space
      value: 2
---
id: LNX-KRN-002
title: Ocultar direcciones del kernel (kptr_restrict)
description: kernel.kptr_restrict debe ser 1 o superior para no exponer punteros del kernel a usuarios sin privilegios.
rationale: Las direcciones del kernel en /proc facilitan saltarse KASLR al explotar vulnerabilidades locales.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SI-16]
  mitre_mitigations: [M1050]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: kernel.kptr_restrict
  op: gte
  expected: 1
remediation:
  summary: Fijar kernel.kptr_restrict = 2 (o 1).
  commands: |
    echo 'kernel.kptr_restrict = 2' > /etc/sysctl.d/60-adarve-kptr.conf
    sysctl -w kernel.kptr_restrict=2
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: kernel.kptr_restrict
      value: 2
---
id: LNX-KRN-003
title: Restringir dmesg a usuarios privilegiados
description: kernel.dmesg_restrict debe ser 1 para que solo root pueda leer el buffer del kernel.
rationale: El log del kernel puede revelar direcciones de memoria y detalles útiles para explotar el sistema.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SI-11]
  mitre_mitigations: [M1050]
check:
  probe: sysctl
  key: kernel.dmesg_restrict
  op: eq
  expected: 1
remediation:
  summary: Fijar kernel.dmesg_restrict = 1.
  commands: |
    echo 'kernel.dmesg_restrict = 1' > /etc/sysctl.d/60-adarve-dmesg.conf
    sysctl -w kernel.dmesg_restrict=1
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: kernel.dmesg_restrict
      value: 1
---
id: LNX-KRN-004
title: Restringir ptrace (Yama)
description: kernel.yama.ptrace_scope debe ser 1 o superior para que un proceso no pueda inspeccionar otros procesos arbitrarios del mismo usuario.
rationale: Sin esta restricción, un proceso comprometido puede leer la memoria de otros (p. ej. robar credenciales de ssh-agent o del navegador).
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-6]
  mitre_mitigations: [M1026]
  mitre_techniques: [T1055.008]
check:
  probe: sysctl
  key: kernel.yama.ptrace_scope
  op: gte
  expected: 1
  on_missing: na
remediation:
  summary: Fijar kernel.yama.ptrace_scope = 1.
  commands: |
    echo 'kernel.yama.ptrace_scope = 1' > /etc/sysctl.d/60-adarve-ptrace.conf
    sysctl -w kernel.yama.ptrace_scope=1
  breaking_risk: low
  actions:
    - type: sysctl.set
      key: kernel.yama.ptrace_scope
      value: 1
      optional: true
impact: Los depuradores (gdb, strace -p) solo podrán adjuntarse a procesos hijos salvo que se ejecuten como root.
---
id: LNX-KRN-005
title: Sin volcados de memoria de binarios setuid
description: fs.suid_dumpable debe ser 0 para que los programas setuid no generen core dumps.
rationale: Un core dump de un proceso privilegiado puede contener contraseñas, claves o hashes legibles por usuarios sin privilegios.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-6]
check:
  probe: sysctl
  key: fs.suid_dumpable
  op: eq
  expected: 0
remediation:
  summary: Fijar fs.suid_dumpable = 0 y limitar los core dumps.
  commands: |
    echo 'fs.suid_dumpable = 0' > /etc/sysctl.d/60-adarve-coredump.conf
    sysctl -w fs.suid_dumpable=0
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: fs.suid_dumpable
      value: 0
---
id: LNX-KRN-006
title: Protección de enlaces simbólicos y duros
description: fs.protected_symlinks y fs.protected_hardlinks deben estar activados.
rationale: Impiden ataques de condición de carrera en directorios con escritura global como /tmp (TOCTOU) para escalar privilegios.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-6]
  mitre_techniques: [T1068]
check:
  all:
    - label: fs.protected_symlinks
      probe: sysctl
      key: fs.protected_symlinks
      op: eq
      expected: 1
    - label: fs.protected_hardlinks
      probe: sysctl
      key: fs.protected_hardlinks
      op: eq
      expected: 1
remediation:
  summary: Activar ambos parámetros.
  commands: |
    printf 'fs.protected_symlinks = 1\nfs.protected_hardlinks = 1\n' > /etc/sysctl.d/60-adarve-links.conf
    sysctl --system
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: fs.protected_symlinks
      value: 1
    - type: sysctl.set
      key: fs.protected_hardlinks
      value: 1
---
id: LNX-KRN-007
title: BPF sin privilegios deshabilitado
description: kernel.unprivileged_bpf_disabled debe ser 1 o 2.
rationale: eBPF sin privilegios ha sido el vector de numerosas escaladas de privilegios locales.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [CM-7]
  mitre_mitigations: [M1050]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: kernel.unprivileged_bpf_disabled
  op: gte
  expected: 1
  on_missing: na
remediation:
  summary: Fijar kernel.unprivileged_bpf_disabled = 1.
  commands: |
    echo 'kernel.unprivileged_bpf_disabled = 1' > /etc/sysctl.d/60-adarve-bpf.conf
    sysctl -w kernel.unprivileged_bpf_disabled=1
  breaking_risk: low
  actions:
    - type: sysctl.set
      key: kernel.unprivileged_bpf_disabled
      value: 2
      optional: true
impact: Herramientas eBPF ejecutadas por usuarios sin privilegios dejarán de funcionar.
---
id: LNX-KRN-008
title: Protección de FIFOs y ficheros en directorios compartidos
description: fs.protected_fifos y fs.protected_regular deben estar activados.
rationale: Impiden que un proceso privilegiado abra con O_CREAT un FIFO o fichero que otro usuario ha creado de antemano en un directorio compartido con sticky bit (/tmp), una vía clásica de escalada de privilegios.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-6]
  mitre_techniques: [T1068]
check:
  all:
    - {label: fs.protected_fifos, probe: sysctl, key: fs.protected_fifos, op: gte, expected: 1}
    - {label: fs.protected_regular, probe: sysctl, key: fs.protected_regular, op: gte, expected: 1}
remediation:
  summary: Fijar ambos parámetros en 2 (también en directorios con escritura de grupo).
  commands: |
    printf 'fs.protected_fifos = 2\nfs.protected_regular = 2\n' > /etc/sysctl.d/60-adarve-fifos.conf
    sysctl --system
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: fs.protected_fifos
      value: 2
    - type: sysctl.set
      key: fs.protected_regular
      value: 2
---
id: LNX-KRN-009
title: Eventos de rendimiento restringidos (perf_event_paranoid)
description: kernel.perf_event_paranoid debe ser 2 o mayor.
rationale: Con valores bajos, cualquier usuario puede usar perf para observar el kernel y otros procesos, y el subsistema ha tenido numerosas vulnerabilidades de escalada de privilegios.
category: Kernel
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-6, SC-39]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: kernel.perf_event_paranoid
  op: gte
  expected: 2
  on_missing: na
remediation:
  summary: Fijar kernel.perf_event_paranoid = 2 (o más, si la distribución lo admite).
  commands: |
    echo 'kernel.perf_event_paranoid = 2' > /etc/sysctl.d/60-adarve-perf.conf
    sysctl --system
  breaking_risk: low
  actions:
    - type: sysctl.set
      key: kernel.perf_event_paranoid
      value: 2
      optional: true
impact: Los usuarios sin privilegios no pueden perfilar el sistema con perf; los desarrolladores que lo necesiten deben usar sudo.
---
id: LNX-KRN-010
title: Carga de kernels en caliente deshabilitada (kexec)
description: kernel.kexec_load_disabled debe estar activado.
rationale: kexec permite sustituir el kernel en ejecución sin pasar por el arranque seguro; un atacante con root puede usarlo para cargar un kernel modificado y persistir sin dejar rastro en disco.
category: Kernel
severity: low
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [CM-7, SI-7]
  mitre_techniques: [T1014, T1542]
check:
  probe: sysctl
  key: kernel.kexec_load_disabled
  op: eq
  expected: 1
  on_missing: na
remediation:
  summary: Activar kernel.kexec_load_disabled (no se puede volver a desactivar hasta reiniciar).
  commands: |
    echo 'kernel.kexec_load_disabled = 1' > /etc/sysctl.d/60-adarve-kexec.conf
    sysctl --system
  breaking_risk: medium
  actions:
    - type: sysctl.set
      key: kernel.kexec_load_disabled
      value: 1
      optional: true
impact: kdump y los reinicios rápidos con kexec dejan de funcionar si se activa antes de que carguen su kernel. Es irreversible hasta reiniciar.
---
id: LNX-KRN-011
title: Carga automática de disciplinas de línea TTY deshabilitada
description: dev.tty.ldisc_autoload debe estar desactivado.
rationale: Impide que un usuario sin privilegios haga que el kernel cargue módulos de disciplinas de línea poco usados, fuente de varias escaladas de privilegios (p. ej. CVE-2017-2636).
category: Kernel
severity: low
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [CM-7]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: dev.tty.ldisc_autoload
  op: eq
  expected: 0
  on_missing: na
remediation:
  summary: Fijar dev.tty.ldisc_autoload = 0.
  commands: |
    echo 'dev.tty.ldisc_autoload = 0' > /etc/sysctl.d/60-adarve-tty.conf
    sysctl --system
  breaking_risk: low
  actions:
    - type: sysctl.set
      key: dev.tty.ldisc_autoload
      value: 0
      optional: true
---
id: LNX-KRN-012
title: Compilador JIT de BPF reforzado
description: net.core.bpf_jit_harden debe valer 2.
rationale: El endurecimiento del JIT de BPF ofusca las constantes del código generado y dificulta los ataques de JIT spraying contra el kernel.
category: Kernel
severity: low
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [SI-16]
  mitre_techniques: [T1068]
check:
  probe: sysctl
  key: net.core.bpf_jit_harden
  op: eq
  expected: 2
  on_missing: na
remediation:
  summary: Fijar net.core.bpf_jit_harden = 2.
  commands: |
    echo 'net.core.bpf_jit_harden = 2' > /etc/sysctl.d/60-adarve-bpf.conf
    sysctl --system
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.core.bpf_jit_harden
      value: 2
      optional: true
