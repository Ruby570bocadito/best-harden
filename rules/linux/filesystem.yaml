id: LNX-FS-006
title: Permisos de /etc/crontab
description: /etc/crontab debe pertenecer a root con permisos 0600.
rationale: Evita que usuarios sin privilegios lean o modifiquen tareas que se ejecutan como root.
category: Sistema de ficheros
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-3]
  mitre_mitigations: [M1022]
  mitre_techniques: [T1053.003]
check:
  all:
    - {label: permisos, probe: file, path: /etc/crontab, field: mode, op: mode_max, expected: "0600", on_missing: na}
    - {label: propietario, probe: file, path: /etc/crontab, field: owner, op: eq, expected: root, on_missing: na}
remediation:
  summary: Ajustar propietario y permisos.
  commands: |
    chown root:root /etc/crontab && chmod 600 /etc/crontab
  breaking_risk: none
  actions:
    - type: file.mode
      path: /etc/crontab
      mode: '0600'
      owner: root
      group: root
