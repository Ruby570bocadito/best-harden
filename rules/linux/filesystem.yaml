id: LNX-FS-003
title: Permisos de /etc/shadow
description: /etc/shadow debe pertenecer a root (grupo root o shadow) con permisos 0640 o más restrictivos.
rationale: Contiene los hashes de las contraseñas; si es legible se pueden crackear fuera de línea.
category: Sistema de ficheros
severity: high
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-3, IA-5]
  mitre_mitigations: [M1022]
  mitre_techniques: [T1003.008]
check:
  all:
    - {label: permisos, probe: file, path: /etc/shadow, field: mode, op: mode_max, expected: "0640"}
    - {label: propietario, probe: file, path: /etc/shadow, field: owner, op: eq, expected: root}
    - {label: grupo, probe: file, path: /etc/shadow, field: group, op: in, expected: [root, shadow]}
remediation:
  summary: Restaurar propietario y permisos.
  commands: |
    chown root:shadow /etc/shadow 2>/dev/null || chown root:root /etc/shadow
    chmod 640 /etc/shadow
  breaking_risk: none
  actions:
    - type: file.mode
      path: /etc/shadow
      mode: '0640'
      owner: root
      group: [shadow, root]
---
id: LNX-FS-004
title: Permisos de /etc/passwd
description: /etc/passwd debe pertenecer a root:root con permisos 0644 o más restrictivos.
rationale: Si fuera escribible, cualquiera podría crear una cuenta con UID 0.
category: Sistema de ficheros
severity: high
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AC-3]
  mitre_mitigations: [M1022]
  mitre_techniques: [T1136.001]
check:
  all:
    - {label: permisos, probe: file, path: /etc/passwd, field: mode, op: mode_max, expected: "0644"}
    - {label: propietario, probe: file, path: /etc/passwd, field: owner, op: eq, expected: root}
remediation:
  summary: Restaurar propietario y permisos.
  commands: |
    chown root:root /etc/passwd && chmod 644 /etc/passwd
  breaking_risk: none
  actions:
    - type: file.mode
      path: /etc/passwd
      mode: '0644'
      owner: root
      group: root
