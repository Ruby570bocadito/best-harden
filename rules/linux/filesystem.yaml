# Sistema de ficheros: particiones, opciones de montaje y permisos críticos.
id: LNX-FS-001
title: /tmp en partición propia con nodev, nosuid y noexec
description: /tmp debe ser un punto de montaje separado con las opciones nodev, nosuid y noexec.
rationale: /tmp es escribible por todos; sin estas opciones es un lugar habitual para ejecutar binarios descargados por un atacante.
category: Sistema de ficheros
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7, AC-3]
  mitre_mitigations: [M1022]
  mitre_techniques: [T1059.004]
check:
  all:
    - {label: montaje propio, probe: mount, path: /tmp, op: exists}
    - {label: opciones, probe: mount, path: /tmp, field: options, op: contains, expected: [nodev, nosuid, noexec]}
remediation:
  summary: Montar /tmp como tmpfs (o partición) con nodev,nosuid,noexec.
  commands: |
    systemctl unmask tmp.mount 2>/dev/null
    mkdir -p /etc/systemd/system/tmp.mount.d
    printf '[Mount]\nOptions=mode=1777,strictatime,nosuid,nodev,noexec,size=25%%\n' > /etc/systemd/system/tmp.mount.d/adarve.conf
    systemctl daemon-reload && systemctl enable --now tmp.mount
  breaking_risk: medium
  reboot_required: true
impact: Algunos instaladores ejecutan scripts desde /tmp; con noexec fallarán (configura TMPDIR en esos casos).
