id: LNX-FS-002
title: /dev/shm con nodev, nosuid y noexec
description: La memoria compartida /dev/shm debe montarse con nodev, nosuid y noexec.
rationale: /dev/shm es escribible por todos y se usa para ejecutar cargas sin tocar el disco.
category: Sistema de ficheros
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7]
  mitre_techniques: [T1059.004]
check:
  probe: mount
  path: /dev/shm
  field: options
  op: contains
  expected: [nodev, nosuid, noexec]
  on_missing: na
remediation:
  summary: Añadir a /etc/fstab "tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0" y remontar.
  commands: |
    mount -o remount,nodev,nosuid,noexec /dev/shm
  breaking_risk: low
