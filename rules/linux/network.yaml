id: LNX-NET-003
title: No enviar redirecciones ICMP
description: El equipo no debe enviar redirecciones ICMP (send_redirects = 0).
rationale: Solo los routers necesitan enviar redirecciones; en un servidor pueden facilitar la manipulación de rutas.
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-7]
check:
  all:
    - {label: all, probe: sysctl, key: net.ipv4.conf.all.send_redirects, op: eq, expected: 0}
    - {label: default, probe: sysctl, key: net.ipv4.conf.default.send_redirects, op: eq, expected: 0}
remediation:
  summary: Fijar send_redirects = 0.
  commands: |
    printf 'net.ipv4.conf.all.send_redirects = 0\nnet.ipv4.conf.default.send_redirects = 0\n' > /etc/sysctl.d/60-bastion-sendredirects.conf
    sysctl --system
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.ipv4.conf.all.send_redirects
      value: 0
    - type: sysctl.set
      key: net.ipv4.conf.default.send_redirects
      value: 0
