# Parámetros de red del kernel (sysctl).
id: LNX-NET-001
title: Reenvío de paquetes IP deshabilitado
description: El equipo no debe enrutar paquetes entre interfaces (net.ipv4.ip_forward = 0) salvo que sea un router.
rationale: Un servidor que reenvía tráfico puede usarse para pivotar entre redes y saltarse la segmentación.
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-7, CM-7]
  mitre_mitigations: [M1030]
check:
  all:
    - label: IPv4
      probe: sysctl
      key: net.ipv4.ip_forward
      op: eq
      expected: 0
    - label: IPv6
      probe: sysctl
      key: net.ipv6.conf.all.forwarding
      op: eq
      expected: 0
      on_missing: na
remediation:
  summary: Deshabilitar el reenvío IPv4/IPv6 si el equipo no es un router.
  commands: |
    printf 'net.ipv4.ip_forward = 0\nnet.ipv6.conf.all.forwarding = 0\n' > /etc/sysctl.d/60-bastion-forward.conf
    sysctl --system
  breaking_risk: medium
  actions:
    - type: sysctl.set
      key: net.ipv4.ip_forward
      value: 0
    - type: sysctl.set
      key: net.ipv6.conf.all.forwarding
      value: 0
      optional: true
impact: Los hosts de Docker, Kubernetes, VPN o routers NECESITAN el reenvío activado; crea una excepción para ellos.
---
id: LNX-NET-002
title: No aceptar redirecciones ICMP
description: El kernel no debe aceptar redirecciones ICMP (accept_redirects = 0) en IPv4 ni IPv6.
rationale: Un atacante en la red local puede usar redirecciones ICMP para desviar el tráfico a través de su equipo (MitM).
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-7]
  mitre_techniques: [T1557]
check:
  all:
    - {label: ipv4 all, probe: sysctl, key: net.ipv4.conf.all.accept_redirects, op: eq, expected: 0}
    - {label: ipv4 default, probe: sysctl, key: net.ipv4.conf.default.accept_redirects, op: eq, expected: 0}
    - {label: ipv6 all, probe: sysctl, key: net.ipv6.conf.all.accept_redirects, op: eq, expected: 0, on_missing: na}
    - {label: ipv6 default, probe: sysctl, key: net.ipv6.conf.default.accept_redirects, op: eq, expected: 0, on_missing: na}
remediation:
  summary: Fijar accept_redirects = 0 en all y default para IPv4 e IPv6.
  commands: |
    cat > /etc/sysctl.d/60-bastion-redirects.conf <<'CONF'
    net.ipv4.conf.all.accept_redirects = 0
    net.ipv4.conf.default.accept_redirects = 0
    net.ipv6.conf.all.accept_redirects = 0
    net.ipv6.conf.default.accept_redirects = 0
    CONF
    sysctl --system
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.ipv4.conf.all.accept_redirects
      value: 0
    - type: sysctl.set
      key: net.ipv4.conf.default.accept_redirects
      value: 0
    - type: sysctl.set
      key: net.ipv6.conf.all.accept_redirects
      value: 0
      optional: true
    - type: sysctl.set
      key: net.ipv6.conf.default.accept_redirects
      value: 0
      optional: true
