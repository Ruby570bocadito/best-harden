id: LNX-NET-008
title: Ignorar ICMP de difusión y respuestas falsas
description: icmp_echo_ignore_broadcasts e icmp_ignore_bogus_error_responses deben ser 1.
rationale: Evita que el equipo participe en ataques smurf y llene los logs con errores ICMP falsos.
category: Red
severity: low
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-5]
check:
  all:
    - {label: broadcasts, probe: sysctl, key: net.ipv4.icmp_echo_ignore_broadcasts, op: eq, expected: 1}
    - {label: bogus, probe: sysctl, key: net.ipv4.icmp_ignore_bogus_error_responses, op: eq, expected: 1}
remediation:
  summary: Fijar ambos parámetros a 1.
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.ipv4.icmp_echo_ignore_broadcasts
      value: 1
    - type: sysctl.set
      key: net.ipv4.icmp_ignore_bogus_error_responses
      value: 1
---
id: LNX-NET-009
title: No aceptar anuncios de router IPv6
description: El equipo no debe autoconfigurarse con anuncios de router IPv6 (accept_ra = 0).
rationale: Un atacante local puede anunciarse como router IPv6 y capturar el tráfico (ataques SLAAC/RA).
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l2]
references:
  nist: [SC-7]
  mitre_techniques: [T1557]
check:
  all:
    - {label: all, probe: sysctl, key: net.ipv6.conf.all.accept_ra, op: eq, expected: 0, on_missing: na}
    - {label: default, probe: sysctl, key: net.ipv6.conf.default.accept_ra, op: eq, expected: 0, on_missing: na}
remediation:
  summary: Fijar accept_ra = 0 y configurar IPv6 de forma estática.
  breaking_risk: high
  # Sin RA, un equipo que se administra por IPv6 con SLAAC pierde la
  # conectividad (y la sesión SSH): se aplica con dead-man switch.
  safety: remote-access
  actions:
    - type: sysctl.set
      key: net.ipv6.conf.all.accept_ra
      value: 0
      optional: true
    - type: sysctl.set
      key: net.ipv6.conf.default.accept_ra
      value: 0
      optional: true
impact: En redes que dependen de SLAAC el equipo perderá la conectividad IPv6.
