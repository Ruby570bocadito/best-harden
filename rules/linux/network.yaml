id: LNX-NET-004
title: No aceptar paquetes con enrutamiento de origen
description: Los paquetes con source routing deben rechazarse (accept_source_route = 0).
rationale: El enrutamiento de origen permite a un atacante decidir la ruta del paquete y saltarse controles de red.
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-7]
check:
  all:
    - {label: ipv4 all, probe: sysctl, key: net.ipv4.conf.all.accept_source_route, op: eq, expected: 0}
    - {label: ipv4 default, probe: sysctl, key: net.ipv4.conf.default.accept_source_route, op: eq, expected: 0}
    - {label: ipv6 all, probe: sysctl, key: net.ipv6.conf.all.accept_source_route, op: eq, expected: 0, on_missing: na}
    - {label: ipv6 default, probe: sysctl, key: net.ipv6.conf.default.accept_source_route, op: eq, expected: 0, on_missing: na}
remediation:
  summary: Fijar accept_source_route = 0 en IPv4 e IPv6.
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.ipv4.conf.all.accept_source_route
      value: 0
    - type: sysctl.set
      key: net.ipv4.conf.default.accept_source_route
      value: 0
    - type: sysctl.set
      key: net.ipv6.conf.all.accept_source_route
      value: 0
      optional: true
    - type: sysctl.set
      key: net.ipv6.conf.default.accept_source_route
      value: 0
      optional: true
