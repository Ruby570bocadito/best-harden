id: LNX-NET-005
title: Filtro de ruta inversa (anti-spoofing)
description: El filtro de ruta inversa estricto (rp_filter = 1) debe estar activo.
rationale: Descarta paquetes con direcciones de origen falsificadas que no podrían llegar por esa interfaz.
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-7]
check:
  all:
    - {label: all, probe: sysctl, key: net.ipv4.conf.all.rp_filter, op: eq, expected: 1}
    - {label: default, probe: sysctl, key: net.ipv4.conf.default.rp_filter, op: eq, expected: 1}
remediation:
  summary: Fijar rp_filter = 1.
  commands: |
    printf 'net.ipv4.conf.all.rp_filter = 1\nnet.ipv4.conf.default.rp_filter = 1\n' > /etc/sysctl.d/60-bastion-rpfilter.conf
    sysctl --system
  breaking_risk: medium
  # rp_filter estricto corta el tráfico con rutas asimétricas o varias
  # interfaces (incluida la sesión SSH): se aplica con dead-man switch.
  safety: remote-access
  actions:
    - type: sysctl.set
      key: net.ipv4.conf.all.rp_filter
      value: 1
    - type: sysctl.set
      key: net.ipv4.conf.default.rp_filter
      value: 1
impact: En redes con enrutamiento asimétrico (varias interfaces o rutas) puede descartar tráfico legítimo; usa el modo 2 (loose) o una excepción.
