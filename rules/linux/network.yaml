id: LNX-NET-006
title: SYN cookies activadas
description: net.ipv4.tcp_syncookies debe ser 1.
rationale: Las SYN cookies mantienen el servicio disponible durante ataques de inundación SYN.
category: Red
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [SC-5]
  mitre_techniques: [T1499]
check:
  probe: sysctl
  key: net.ipv4.tcp_syncookies
  op: eq
  expected: 1
remediation:
  summary: Fijar net.ipv4.tcp_syncookies = 1.
  breaking_risk: none
  actions:
    - type: sysctl.set
      key: net.ipv4.tcp_syncookies
      value: 1
