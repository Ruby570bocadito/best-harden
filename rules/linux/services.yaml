id: LNX-SVC-006
title: Sincronización horaria activa
description: Debe haber un servicio de sincronización horaria activo (chrony o systemd-timesyncd).
rationale: Sin hora fiable no se pueden correlacionar logs ni validar certificados y Kerberos.
category: Servicios
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [AU-8]
check:
  any:
    - {label: chrony, probe: systemd, unit: chrony.service, field: active, op: eq, expected: active}
    - {label: chronyd, probe: systemd, unit: chronyd.service, field: active, op: eq, expected: active}
    - {label: systemd-timesyncd, probe: systemd, unit: systemd-timesyncd.service, field: active, op: eq, expected: active}
remediation:
  summary: Instalar y activar chrony (o systemd-timesyncd).
  commands: |
    apt-get install -y chrony 2>/dev/null || dnf install -y chrony
    systemctl enable --now chrony 2>/dev/null || systemctl enable --now chronyd
  breaking_risk: none
