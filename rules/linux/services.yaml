# Servicios innecesarios o inseguros. Si el servicio no está instalado, cumple.
id: LNX-SVC-001
title: Avahi (mDNS) deshabilitado
description: El servicio avahi-daemon no debe estar habilitado ni en ejecución en servidores.
rationale: mDNS/DNS-SD anuncia servicios en la red local y amplía la superficie de ataque sin aportar nada en un servidor.
category: Servicios
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1557]
check:
  all:
    - {label: arranque, probe: systemd, unit: avahi-daemon.service, field: enabled, op: not_in, expected: [enabled, enabled-runtime], on_missing: pass}
    - {label: estado, probe: systemd, unit: avahi-daemon.service, field: active, op: ne, expected: active, on_missing: pass}
remediation:
  summary: Detener y enmascarar avahi.
  commands: |
    systemctl stop avahi-daemon.socket avahi-daemon.service
    systemctl mask avahi-daemon.socket avahi-daemon.service
  breaking_risk: low
  actions:
    # Primero el servicio y después el socket: el rollback va en orden
    # inverso y el servicio (Requires= del socket) solo arranca si el socket
    # ya está desenmascarado.
    - type: systemd.disable
      unit: avahi-daemon.service
      mask: true
    - type: systemd.disable
      unit: avahi-daemon.socket
      mask: true
