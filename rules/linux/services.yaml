id: LNX-SVC-004
title: Servidor Telnet no instalado
description: No debe haber un servidor Telnet instalado.
rationale: Telnet transmite credenciales y sesiones en texto claro.
category: Servicios
severity: high
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7, SC-8]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1040]
check:
  all:
    - {label: telnetd, probe: package, name: telnetd, op: absent}
    - {label: inetutils-telnetd, probe: package, name: inetutils-telnetd, op: absent}
    - {label: telnet-server, probe: package, name: telnet-server, op: absent}
remediation:
  summary: Desinstalar el servidor Telnet y usar SSH.
  commands: |
    apt-get purge -y telnetd inetutils-telnetd 2>/dev/null || dnf remove -y telnet-server
  breaking_risk: low
---
id: LNX-SVC-005
title: Servidor FTP no instalado
description: vsftpd no debe estar instalado salvo necesidad justificada.
rationale: FTP transmite credenciales en claro; usa SFTP.
category: Servicios
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7, SC-8]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1040]
check:
  probe: package
  name: vsftpd
  op: absent
remediation:
  summary: Desinstalar vsftpd y usar SFTP.
  breaking_risk: medium
