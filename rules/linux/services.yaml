id: LNX-SVC-003
title: rpcbind deshabilitado
description: rpcbind no debe estar activo salvo que el equipo use NFSv3 u otros servicios RPC.
rationale: rpcbind expone información de servicios RPC y se ha usado para amplificación DDoS.
category: Servicios
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
check:
  all:
    - {label: arranque, probe: systemd, unit: rpcbind.service, field: enabled, op: not_in, expected: [enabled, enabled-runtime], on_missing: pass}
    - {label: estado, probe: systemd, unit: rpcbind.service, field: active, op: ne, expected: active, on_missing: pass}
remediation:
  summary: Detener y enmascarar rpcbind.
  commands: |
    systemctl stop rpcbind.socket rpcbind.service
    systemctl mask rpcbind.socket rpcbind.service
  breaking_risk: medium
  actions:
    # Primero el servicio y después el socket: el rollback va en orden
    # inverso y el servicio (Requires= del socket) solo arranca si el socket
    # ya está desenmascarado.
    - type: systemd.disable
      unit: rpcbind.service
      mask: true
    - type: systemd.disable
      unit: rpcbind.socket
      mask: true
impact: Los montajes NFSv3 dejarán de funcionar.
