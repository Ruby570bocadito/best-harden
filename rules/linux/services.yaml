id: LNX-SVC-002
title: Servidor de impresión CUPS deshabilitado
description: El servicio cups no debe estar habilitado en servidores que no imprimen.
rationale: CUPS ha tenido vulnerabilidades graves de ejecución remota y no es necesario en la mayoría de servidores.
category: Servicios
severity: medium
platforms: [linux]
profiles: [linux-server-l1]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1210]
check:
  all:
    - {label: arranque, probe: systemd, unit: cups.service, field: enabled, op: not_in, expected: [enabled, enabled-runtime], on_missing: pass}
    - {label: estado, probe: systemd, unit: cups.service, field: active, op: ne, expected: active, on_missing: pass}
remediation:
  summary: Detener y enmascarar cups (o desinstalarlo).
  commands: |
    systemctl stop cups.socket cups.service cups-browsed.service 2>/dev/null
    systemctl mask cups.socket cups.service cups-browsed.service
  breaking_risk: low
  actions:
    # Primero el servicio y después el socket: el rollback va en orden
    # inverso y el servicio (Requires= del socket) solo arranca si el socket
    # ya está desenmascarado.
    - type: systemd.disable
      unit: cups.service
      mask: true
    - type: systemd.disable
      unit: cups.socket
      mask: true
    - type: systemd.disable
      unit: cups-browsed.service
      mask: true
