# GoReleaser v2 · https://goreleaser.com
# Se ejecuta desde .github/workflows/release.yml al publicar una etiqueta vX.Y.Z.
version: 2
project_name: adarve

before:
  hooks:
    # Sin modificar nada: la release se compila exactamente desde la etiqueta.
    - go mod verify
    - go mod tidy -diff
    - go test ./...

builds:
  - id: adarve
    main: ./cmd/adarve
    binary: adarve
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Ruby570bocadito/adarve/internal/version.Version={{ .Version }}
      - -X github.com/Ruby570bocadito/adarve/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/Ruby570bocadito/adarve/internal/version.Date={{ .Date }}
      - -X github.com/Ruby570bocadito/adarve/internal/version.Repo={{ envOrDefault "GITHUB_REPOSITORY" "Ruby570bocadito/adarve" }}

archives:
  - id: default
    # Nombre SIN versión: los instaladores y "adarve update" lo construyen
    # a partir del sistema y la arquitectura.
    name_template: "adarve_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

release:
  # vX.Y.Z-rc.1 y similares se publican como pre-release: no pasan a ser
  # «latest» (lo que instalan el instalador y adarve update).
  prerelease: auto
  extra_files:
    # version.txt lo genera el workflow: es lo que consultan los instaladores
    # en <releases>/latest/download/version.txt
    - glob: ./.release/version.txt
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
